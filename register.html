<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAITHAM DISCOUNT - التسجيل</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f7;
      font-family: Arial, Tahoma, sans-serif;
      color: #111;
    }

    .box {
      max-width: 430px;
      margin: 70px auto;
      background: #fff;
      padding: 30px 22px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .arabic {
      margin-top: 8px;
      color: #666;
      font-size: 17px;
    }

    .text {
      margin-top: 20px;
      color: #666;
      line-height: 1.8;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 17px;
      border-radius: 13px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .button:hover {
      background: #333;
    }
  </style>
</head>

<body>
  <div class="box">

    <div class="logo">HAITHAM DISCOUNT</div>

    <div class="arabic">هيثم ديسكاونت</div>

    <div class="text">
      سجّل بياناتك للحصول على بطاقة الخصومات الرقمية
      والاستفادة من العروض والخصومات لدى المحلات المشاركة.
    </div>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbwLo29EjRRsz7w4EmFcgt3feOaCUhfYK1JpMhrquaaOHe7a8EEUVQ1T0v4j0AAiPTtz/exec?register=1"
    >
      التسجيل وإصدار البطاقة
    </a>

  </div>
</body>
</html>
