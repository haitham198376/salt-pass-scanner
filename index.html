<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>SALT PASS</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Tahoma, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 430px;
  margin: 20px auto;
  background: white;
  padding: 30px 20px;
  border-radius: 22px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

.logo {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 2px;
}

.shop {
  color: #666;
  font-size: 18px;
  margin-top: 8px;
  margin-bottom: 30px;
}

.choose {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 18px;
}

.discount {
  width: 100%;
  padding: 19px;
  margin: 11px 0;
  border: none;
  border-radius: 14px;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}

.d1 {
  background: #e8f5e9;
  color: #1b5e20;
}

.d2 {
  background: #e3f2fd;
  color: #0d47a1;
}

.d3 {
  background: #fff3e0;
  color: #e65100;
}

#scannerSection {
  display: none;
}

#reader {
  width: 100%;
  margin-top: 20px;
}

.selected {
  margin: 20px 0;
  font-size: 21px;
  font-weight: bold;
}

.selected span {
  color: #1976d2;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 22px;
  border-radius: 18px;
  background: #f1f8e9;
}

.confirm {
  width: 100%;
  padding: 17px;
  border: none;
  border-radius: 13px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
  margin-top: 15px;
  cursor: pointer;
}

.back {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  margin-top: 15px;
  background: #eee;
  font-size: 16px;
  cursor: pointer;
}

.error {
  color: #c62828;
  margin-top: 15px;
}

</style>

</head>

<body>

<div class="container">

<!-- ========================= -->
<!-- الصفحة الرئيسية -->
<!-- ========================= -->

<div id="home">

<div class="logo">
SALT PASS
</div>

<div id="shopName" class="shop">
</div>

<div class="choose">
اختر الخصم المقدم للعميل
</div>

<div id="discountButtons"></div>

</div>


<!-- ========================= -->
<!-- الكاميرا -->
<!-- ========================= -->

<div id="scannerSection">

<div class="logo">
SALT PASS
</div>

<div id="scannerShopName" class="shop">
</div>

<div class="selected">

الخصم المختار:

<span id="selectedDiscount"></span>

</div>

<p>
وجّه كاميرا الهاتف نحو QR بطاقة العميل
</p>

<div id="reader"></div>

<div id="cameraError" class="error"></div>

<button
class="back"
onclick="goBack()">

رجوع

</button>

</div>


<!-- ========================= -->
<!-- النتيجة -->
<!-- ========================= -->

<div id="result">

<h2>
✅ البطاقة صالحة
</h2>

<p>

<strong>
رقم العضوية
</strong>

<br>

<span id="memberId"></span>

</p>

<p>

<strong>
الخصم
</strong>

<br>

<span id="memberDiscount"></span>

</p>

<button
class="confirm"
onclick="confirmDiscount()">

✅ تأكيد تنفيذ الخصم

</button>

<button
class="back"
onclick="goBack()">

إلغاء

</button>

</div>

</div>


<script>


// =====================================================
// قراءة بيانات المحل من الرابط
// =====================================================

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  urlParams.get("shopId")
  || "SH-0001";


const SHOP_NAME =
  urlParams.get("shop")
  || "مطعم السلط";


const DISCOUNT_1 =
  urlParams.get("d1")
  || "15%";


const DISCOUNT_2 =
  urlParams.get("d2")
  || "20%";


const DISCOUNT_3 =
  urlParams.get("d3")
  || "30%";


// =====================================================
// المتغيرات
// =====================================================

let scanner = null;

let selectedDiscount = "";

let scannedMember = "";


// =====================================================
// عرض بيانات المحل
// =====================================================

function loadShop() {

  document.getElementById(
    "shopName"
  ).innerText =
    SHOP_NAME;


  document.getElementById(
    "scannerShopName"
  ).innerText =
    SHOP_NAME;


  const discounts = [

    DISCOUNT_1,

    DISCOUNT_2,

    DISCOUNT_3

  ];


  const container =
    document.getElementById(
      "discountButtons"
    );


  container.innerHTML = "";


  discounts.forEach(
    function(discount, index) {


      if (!discount) {
        return;
      }


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "discount d" +
        (index + 1);


      button.innerText =
        discount +
        " خصم";


      button.onclick =
        function() {

          startScanner(
            discount
          );

        };


      container.appendChild(
        button
      );

    }
  );

}


// =====================================================
// تشغيل الكاميرا
// =====================================================

function startScanner(
  discount
) {


  selectedDiscount =
    discount;


  document.getElementById(
    "home"
  ).style.display =
    "none";


  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "selectedDiscount"
  ).innerText =
    discount;


  document.getElementById(
    "cameraError"
  ).innerText =
    "";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {


      scannedMember =
        decodedText.trim();


      scanner.stop()

        .then(function() {

          showResult();

        })

        .catch(function() {

          showResult();

        });

    },

    function(errorMessage) {

      // تجاهل أخطاء القراءة العادية

    }

  ).catch(function(error) {


    document.getElementById(
      "cameraError"
    ).innerText =

      "❌ تعذر تشغيل الكاميرا. " +
      "تأكد من السماح للمتصفح باستخدام الكاميرا.";

  });

}


// =====================================================
// عرض النتيجة
// =====================================================

function showResult() {


  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMember;


  document.getElementById(
    "memberDiscount"
  ).innerText =
    selectedDiscount;

}


// =====================================================
// تأكيد الخصم
// =====================================================

function confirmDiscount() {


  if (!scannedMember) {

    alert(
      "❌ لم يتم العثور على رقم العضوية."
    );

    return;

  }


  const appsScriptUrl =

    "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


  const finalUrl =

    appsScriptUrl +

    "?memberId=" +
    encodeURIComponent(
      scannedMember
    ) +

    "&discount=" +
    encodeURIComponent(
      selectedDiscount
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    finalUrl;

}


// =====================================================
// رجوع
// =====================================================

function goBack() {


  try {

    if (scanner) {

      scanner.stop()
        .catch(
          function() {}
        );

    }

  } catch (e) {}


  location.reload();

}


// =====================================================
// تشغيل الصفحة
// =====================================================

loadShop();

</script>

</body>

</html>
