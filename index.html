<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>SALT PASS Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 12px;

  background: #f3f5f7;

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  text-align: center;

}

.container {

  width: 100%;

  max-width: 430px;

  margin: auto;

}

.header {

  background: #111;

  color: white;

  padding: 22px 15px;

  border-radius: 22px;

  margin-bottom: 14px;

}

.logo {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: 2px;

}

.shop {

  font-size: 19px;

  margin-top: 8px;

}

.offer {

  color: #bbb;

  margin-top: 7px;

  font-size: 14px;

}

.scanner {

  background: white;

  padding: 12px;

  border-radius: 20px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}

.camera-wrap {

  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 15px;

  background: #000;

}

#video {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

}

.scan-frame {

  position: absolute;

  width: 65%;

  aspect-ratio: 1 / 1;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  border:
    3px solid white;

  border-radius: 18px;

  pointer-events: none;

}

.instruction {

  margin: 14px 5px;

  color: #555;

  font-size: 14px;

  line-height: 1.7;

}

.error {

  display: none;

  margin-top: 12px;

  background: #ffebee;

  color: #c62828;

  padding: 12px;

  border-radius: 12px;

  font-size: 13px;

  line-height: 1.7;

}

button {

  width: 100%;

  border: none;

  border-radius: 13px;

  padding: 16px;

  margin-top: 12px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

.confirm {

  background: #111;

  color: white;

}

.back {

  background: #e8e8e8;

  color: #111;

}

#result {

  display: none;

  margin-top: 15px;

  background: #f1f8e9;

  padding: 22px;

  border-radius: 18px;

}

.success {

  color: #2e7d32;

  font-size: 20px;

  font-weight: bold;

}

.member {

  font-size: 26px;

  font-weight: bold;

  margin: 15px 0;

}

.offer-result {

  font-size: 16px;

  font-weight: bold;

}

#canvas {

  display: none;

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div
      id="shopName"
      class="shop">
      جاري تحميل المحل...
    </div>

    <div
      id="offerTitle"
      class="offer">
      جاري تحميل العرض...
    </div>

  </div>


  <div
    id="scannerBox"
    class="scanner">


    <div class="instruction">

      وجّه كاميرا الهاتف نحو QR بطاقة العميل

    </div>


    <div class="camera-wrap">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-frame"></div>

    </div>


    <canvas id="canvas"></canvas>


    <div
      id="error"
      class="error">
    </div>


    <button
      class="back"
      onclick="goBack()">

      رجوع

    </button>


  </div>


  <div id="result">

    <div class="success">
      ✅ تم قراءة بطاقة العميل
    </div>


    <div
      id="memberId"
      class="member">
    </div>


    <div>
      العرض:
    </div>


    <div
      id="resultOffer"
      class="offer-result">
    </div>


    <button
      class="confirm"
      onclick="confirmOffer()">

      ✅ تأكيد تنفيذ العرض

    </button>


    <button
      class="back"
      onclick="restartScanner()">

      🔄 إعادة المسح

    </button>

  </div>

</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let stream = null;

let scanning = false;

let animationId = null;

let scannedMemberId = "";


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// ERROR
// =====================================================

function showError(message) {

  const error =
    document.getElementById(
      "error"
    );

  error.innerText =
    message;

  error.style.display =
    "block";

}


// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {

  const error =
    document.getElementById(
      "error"
    );

  error.style.display =
    "none";

}


// =====================================================
// CAMERA
// =====================================================

async function startCamera() {

  hideError();


  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "❌ المتصفح لا يدعم تشغيل الكاميرا."
    );

    return;

  }


  try {

    /*
      نطلب الكاميرا مباشرة من المتصفح.
      بدون html5-qrcode.
    */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    await video.play();


    scanning =
      true;


    scanFrame();


  } catch (error) {

    console.error(
      "getUserMedia:",
      error
    );


    showError(

      "❌ تعذر تشغيل كاميرا الهاتف داخل SALT PASS. " +
      "أغلق أي صفحة أو تطبيق آخر يستخدم الكاميرا ثم أعد المحاولة."

    );

  }

}


// =====================================================
// QR SCANNING
// =====================================================

function scanFrame() {

  if (!scanning) {
    return;
  }


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {

    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    context.drawImage(

      video,

      0,
      0,

      canvas.width,
      canvas.height

    );


    const imageData =
      context.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );


    const code =
      jsQR(

        imageData.data,

        imageData.width,

        imageData.height,

        {
          inversionAttempts:
            "attemptBoth"
        }

      );


    if (code && code.data) {

      handleQRCode(
        code.data
      );

      return;

    }

  }


  animationId =
    requestAnimationFrame(
      scanFrame
    );

}


// =====================================================
// HANDLE QR
// =====================================================

function handleQRCode(
  value
) {

  const memberId =
    extractMemberId(
      value
    );


  if (!memberId) {

    showError(
      "⚠️ رمز QR ليس بطاقة SALT PASS."
    );

    animationId =
      requestAnimationFrame(
        scanFrame
      );

    return;

  }


  scannedMemberId =
    memberId;


  stopCamera();


  document.getElementById(
    "scannerBox"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;

}


// =====================================================
// EXTRACT MEMBER ID
// =====================================================

function extractMemberId(
  value
) {

  const text =
    String(
      value || ""
    ).trim();


  // QR يحتوي مباشرة SP-0001

  if (
    /^SP-\d+$/i.test(
      text
    )
  ) {

    return text.toUpperCase();

  }


  // QR يحتوي رابط البطاقة

  try {

    const url =
      new URL(
        text
      );


    const card =
      url.searchParams.get(
        "card"
      );


    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch (e) {}


  // البحث داخل النص

  const match =
    text.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// STOP CAMERA
// =====================================================

function stopCamera() {

  scanning =
    false;


  if (animationId) {

    cancelAnimationFrame(
      animationId
    );

    animationId =
      null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (video) {

    video.srcObject =
      null;

  }

}


// =====================================================
// CONFIRM OFFER
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const url =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    url;

}


// =====================================================
// RESTART
// =====================================================

async function restartScanner() {

  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerBox"
  ).style.display =
    "block";


  scannedMemberId =
    "";


  await startCamera();

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  stopCamera();

  history.back();

}


// =====================================================
// START
// =====================================================

startCamera();

</script>

</body>

</html>
