<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>SALT PASS Scanner</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


<style>

* {
  box-sizing:border-box;
}

body {

  margin:0;

  padding:15px;

  background:#f3f5f7;

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  text-align:center;

}

.container {

  width:100%;

  max-width:430px;

  margin:auto;

}

.header {

  background:#111;

  color:white;

  padding:24px 15px;

  border-radius:22px;

  margin-bottom:15px;

}

.logo {

  font-size:29px;

  font-weight:800;

  letter-spacing:2px;

}

.shop {

  font-size:20px;

  margin-top:8px;

}

.offer {

  color:#bbb;

  font-size:14px;

  margin-top:7px;

  line-height:1.6;

}

.card {

  background:white;

  padding:22px 16px;

  border-radius:20px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}

.title {

  font-size:18px;

  font-weight:bold;

  line-height:1.7;

}

.text {

  margin-top:8px;

  color:#666;

  font-size:13px;

  line-height:1.8;

}

.camera-button {

  display:block;

  width:100%;

  margin-top:20px;

  padding:18px;

  background:#111;

  color:white;

  border-radius:14px;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

}

.camera-input {

  display:none;

}

.status {

  margin-top:15px;

  padding:13px;

  background:#f7f7f7;

  border-radius:12px;

  color:#666;

  font-size:13px;

  line-height:1.7;

}

.error {

  display:none;

  margin-top:13px;

  padding:13px;

  background:#ffebee;

  color:#c62828;

  border-radius:12px;

  font-size:13px;

  line-height:1.7;

}

#preview {

  display:none;

  width:100%;

  max-height:330px;

  object-fit:contain;

  margin-top:15px;

  border-radius:14px;

  background:#eee;

}

#result {

  display:none;

  margin-top:15px;

  background:#f1f8e9;

  padding:24px 18px;

  border-radius:18px;

}

.success {

  color:#2e7d32;

  font-size:20px;

  font-weight:bold;

}

.member-id {

  font-size:28px;

  font-weight:bold;

  margin:15px 0;

}

.offer-result {

  font-weight:bold;

  font-size:16px;

  line-height:1.7;

}

button {

  width:100%;

  border:none;

  border-radius:13px;

  padding:16px;

  margin-top:12px;

  font-size:17px;

  font-weight:bold;

}

.confirm {

  background:#111;

  color:white;

}

.retry {

  background:#e6e6e6;

  color:#111;

}

</style>

</head>


<body>

<div class="container">


<div class="header">

<div class="logo">
SALT PASS
</div>

<div
id="shopName"
class="shop">
</div>

<div
id="offerTitle"
class="offer">
</div>

</div>


<div
id="scannerCard"
class="card">


<div class="title">

📷 مسح بطاقة العميل

</div>


<div class="text">

اضغط الزر لفتح كاميرا الهاتف والتقاط
صورة واضحة لرمز QR الموجود على بطاقة العميل.

</div>


<label
for="cameraInput"
class="camera-button">

📷 التقاط صورة QR

</label>


<input
id="cameraInput"
class="camera-input"
type="file"
accept="image/*"
capture="environment">


<div
id="status"
class="status">

جاهز لالتقاط صورة QR.

</div>


<img
id="preview"
alt="QR">


<div
id="error"
class="error">
</div>


<button
class="retry"
onclick="goBack()">

رجوع

</button>

</div>


<div id="result">

<div class="success">

✅ تم قراءة بطاقة العميل

</div>


<div
id="memberId"
class="member-id">
</div>


<div>

العرض:

</div>


<div
id="resultOffer"
class="offer-result">
</div>


<button
class="confirm"
onclick="confirmOffer()">

✅ تأكيد تنفيذ العرض

</button>


<button
class="retry"
onclick="retry()">

🔄 مسح بطاقة أخرى

</button>

</div>


</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let scannedMemberId = "";

let qrReader = null;


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// STATUS
// =====================================================

function setStatus(
  text
) {

  document.getElementById(
    "status"
  ).innerText =
    text;

}


// =====================================================
// ERROR
// =====================================================

function showError(
  text
) {

  const el =
    document.getElementById(
      "error"
    );


  el.innerText =
    text;


  el.style.display =
    "block";

}


// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {

  const el =
    document.getElementById(
      "error"
    );


  el.innerText =
    "";


  el.style.display =
    "none";

}


// =====================================================
// VALIDATE
// =====================================================

function validate() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return false;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return false;

  }


  return true;

}


// =====================================================
// EXTRACT MEMBER ID
// =====================================================

function extractMemberId(
  text
) {

  const value =
    String(
      text || ""
    ).trim();


  // QR مباشر:
  // SP-0006

  if (
    /^SP-\d+$/i.test(
      value
    )
  ) {

    return value.toUpperCase();

  }


  // QR يحتوي رابط البطاقة

  try {

    const url =
      new URL(
        value
      );


    const card =
      url.searchParams.get(
        "card"
      );


    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch(e) {}


  // SP-XXXX داخل النص

  const match =
    value.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// READ IMAGE FILE
// =====================================================

async function readQrFromFile(
  file
) {

  try {

    if (!qrReader) {

      qrReader =
        new Html5Qrcode(
          "readerHidden"
        );

    }


    /*
      scanFile:
      يقرأ ملف الصورة مباشرة.
      لا يشغل الكاميرا.
    */

    const decodedText =
      await qrReader.scanFile(
        file,
        true
      );


    return decodedText || "";

  } catch(error) {

    console.error(
      "scanFile error:",
      error
    );


    return "";

  }

}


// =====================================================
// HIDDEN READER
// =====================================================

const hidden =
  document.createElement(
    "div"
  );


hidden.id =
  "readerHidden";


hidden.style.display =
  "none";


document.body.appendChild(
  hidden
);


// =====================================================
// IMAGE SELECTION
// =====================================================

document.getElementById(
  "cameraInput"
).addEventListener(
  "change",
  async function(event) {


    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {

      return;

    }


    hideError();


    setStatus(
      "⏳ جاري قراءة QR من الصورة..."
    );


    // عرض الصورة

    const preview =
      document.getElementById(
        "preview"
      );


    const previewUrl =
      URL.createObjectURL(
        file
      );


    preview.src =
      previewUrl;


    preview.style.display =
      "block";


    // قراءة QR

    const decoded =
      await readQrFromFile(
        file
      );


    URL.revokeObjectURL(
      previewUrl
    );


    if (!decoded) {

      setStatus(
        "لم يتم العثور على QR."
      );


      showError(

        "⚠️ لم تتم قراءة QR. " +
        "أعد التقاط الصورة من قريب واجعل رمز QR كاملًا وواضحًا."

      );


      return;

    }


    const memberId =
      extractMemberId(
        decoded
      );


    if (!memberId) {

      setStatus(
        "تم العثور على QR غير صالح."
      );


      showError(
        "⚠️ الرمز المقروء ليس بطاقة SALT PASS."
      );


      return;

    }


    scannedMemberId =
      memberId;


    // نجاح

    document.getElementById(
      "scannerCard"
    ).style.display =
      "none";


    document.getElementById(
      "result"
    ).style.display =
      "block";


    document.getElementById(
      "memberId"
    ).innerText =
      scannedMemberId;


    setStatus(
      "✅ تم التعرف على البطاقة."
    );

  }
);


// =====================================================
// CONFIRM
// =====================================================

function confirmOffer() {

  if (!validate()) {
    return;
  }


  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const finalUrl =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    finalUrl;

}


// =====================================================
// RETRY
// =====================================================

function retry() {

  scannedMemberId =
    "";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "cameraInput"
  ).value =
    "";


  hideError();


  setStatus(
    "جاهز لالتقاط صورة QR."
  );

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  history.back();

}

</script>

</body>

</html>
