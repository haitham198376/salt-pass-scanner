<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SALT PASS - Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:20px;
      background:#f3f5f7;
      font-family:Arial,Tahoma,sans-serif;
      color:#111;
    }

    .container{
      max-width:500px;
      margin:0 auto;
    }

    .header{
      background:#111;
      color:#fff;
      padding:28px 20px;
      border-radius:24px;
      text-align:center;
    }

    .logo{
      font-size:30px;
      font-weight:800;
      letter-spacing:2px;
    }

    .shop-name{
      margin-top:10px;
      font-size:23px;
      font-weight:bold;
    }

    .shop-id{
      margin-top:6px;
      color:#aaa;
      font-size:13px;
    }

    .card{
      background:#fff;
      margin-top:15px;
      padding:20px;
      border-radius:20px;
      box-shadow:0 6px 20px rgba(0,0,0,.06);
    }

    .title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .discount{
      width:100%;
      border:0;
      background:#111;
      color:#fff;
      padding:18px;
      margin-top:10px;
      border-radius:15px;
      text-align:right;
      cursor:pointer;
      font-size:18px;
      font-weight:bold;
    }

    .discount.selected{
      outline:3px solid #777;
    }

    .scan{
      width:100%;
      border:0;
      background:#111;
      color:#fff;
      padding:18px;
      border-radius:14px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    #reader{
      width:100%;
      margin-top:18px;
    }

    #reader video{
      border-radius:15px;
    }

    .status{
      margin-top:14px;
      padding:13px;
      border-radius:12px;
      background:#f4f4f4;
      color:#666;
      line-height:1.8;
    }

    .customer{
      display:none;
      margin-top:15px;
      padding:18px;
      background:#f7f7f7;
      border-radius:15px;
    }

    .customer-name{
      font-size:21px;
      font-weight:bold;
    }

    .customer-id{
      margin-top:7px;
      color:#666;
    }

    .confirm{
      display:none;
      width:100%;
      border:0;
      background:#111;
      color:white;
      padding:17px;
      border-radius:13px;
      margin-top:15px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    .message{
      display:none;
      margin-top:15px;
      padding:14px;
      border-radius:12px;
      line-height:1.8;
    }

    .success{
      background:#e9f7ec;
      color:#256b32;
    }

    .error{
      background:#ffecec;
      color:#b71c1c;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div
      class="shop-name"
      id="shopName"
    >
      المحل
    </div>

    <div
      class="shop-id"
      id="shopId"
    >
    </div>

  </div>


  <div class="card">

    <div class="title">
      الخصومات المتاحة
    </div>

    <div id="discounts"></div>

  </div>


  <div class="card">

    <div class="title">
      بطاقة العميل
    </div>

    <button
      class="scan"
      onclick="startScanner()"
    >
      📷 مسح بطاقة العميل
    </button>

    <div id="reader"></div>

    <div
      class="status"
      id="status"
    >
      اضغط على الزر لفتح كاميرا الهاتف.
    </div>


    <div
      class="customer"
      id="customer"
    >

      <div
        class="customer-name"
        id="customerName"
      >
      </div>

      <div
        class="customer-id"
        id="customerId"
      >
      </div>

    </div>


    <button
      class="confirm"
      id="confirmButton"
      onclick="continueToTransaction()"
    >
      ✅ متابعة تسجيل العملية
    </button>


    <div
      class="message"
      id="message"
    >
    </div>

  </div>

</div>


<script>

  // =================================================
  // قراءة بيانات المحل من الرابط
  // =================================================

  const params =
    new URLSearchParams(
      window.location.search
    );


  const SHOP_ID =
    params.get("shopId") || "";


  const SHOP_NAME =
    params.get("shop") ||
    "";


  const D1 =
    formatDiscount(
      params.get("d1")
    );


  const D2 =
    formatDiscount(
      params.get("d2")
    );


  const D3 =
    formatDiscount(
      params.get("d3")
    );


  const discounts = [];


  if(D1){
    discounts.push(D1);
  }

  if(D2){
    discounts.push(D2);
  }

  if(D3){
    discounts.push(D3);
  }


  document.getElementById(
    "shopId"
  ).innerText =
    SHOP_ID;


  document.getElementById(
    "shopName"
  ).innerText =
    SHOP_NAME || "المحل";


  renderDiscounts();


  let scanner = null;

  let scannerRunning = false;

  let scannedMemberId = "";

  let selectedDiscount = "";


  // =================================================
  // تنسيق الخصم
  // =================================================

  function formatDiscount(value){

    if(
      value === null ||
      value === undefined ||
      value === ""
    ){

      return "";
    }


    let text =
      String(value).trim();


    if(!text){
      return "";
    }


    if(
      text.includes("%")
    ){

      return text;
    }


    let num =
      parseFloat(
        text.replace(
          ",",
          "."
        )
      );


    if(
      !isNaN(num) &&
      num > 0 &&
      num < 1
    ){

      return (
        Math.round(
          num * 100
        ) + "%"
      );
    }


    if(
      !isNaN(num) &&
      num >= 1 &&
      num < 100
    ){

      return (
        Math.round(num) +
        "%"
      );
    }


    return text;
  }


  // =================================================
  // عرض الخصومات
  // =================================================

  function renderDiscounts(){

    const box =
      document.getElementById(
        "discounts"
      );


    box.innerHTML = "";


    if(
      discounts.length === 0
    ){

      box.innerHTML =
        `
        <div class="status">
          لا توجد خصومات مضافة لهذا المحل.
        </div>
        `;

      return;
    }


    discounts.forEach(
      function(discount){

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "discount";


        button.innerText =
          "خصم " + discount;


        button.onclick =
          function(){

            selectDiscount(
              discount,
              button
            );

          };


        box.appendChild(
          button
        );

      }
    );

  }


  // =================================================
  // اختيار الخصم
  // =================================================

  function selectDiscount(
    discount,
    button
  ){

    selectedDiscount =
      discount;


    document
      .querySelectorAll(
        ".discount"
      )
      .forEach(
        function(item){

          item.classList.remove(
            "selected"
          );

        }
      );


    button.classList.add(
      "selected"
    );


    if(scannedMemberId){

      document.getElementById(
        "confirmButton"
      ).style.display =
        "block";

    }


    showStatus(
      "✅ تم اختيار " +
      "خصم " +
      discount
    );

  }


  // =================================================
  // تشغيل الكاميرا
  // =================================================

  function startScanner(){

    if(scannerRunning){

      return;
    }


    showStatus(
      "⏳ جاري تشغيل الكاميرا..."
    );


    scanner =
      new Html5Qrcode(
        "reader"
      );


    scannerRunning =
      true;


    scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        }

      },

      function(decodedText){

        handleScan(
          decodedText
        );

      },

      function(errorMessage){

        // تجاهل أخطاء القراءة المؤقتة

      }

    )

    .then(function(){

      showStatus(
        "📷 وجّه الكاميرا إلى QR بطاقة العميل."
      );

    })

    .catch(function(error){

      scannerRunning =
        false;


      showMessage(
        "تعذر تشغيل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا.",
        false
      );

    });

  }


  // =================================================
  // معالجة QR
  // =================================================

  function handleScan(
    decodedText
  ){

    let memberId =
      "";


    try{

      const url =
        new URL(
          decodedText
        );


      memberId =
        url.searchParams.get(
          "member"
        ) ||
        url.searchParams.get(
          "card"
        ) ||
        "";

    }

    catch(error){

      memberId =
        String(
          decodedText || ""
        ).trim();

    }


    if(!memberId){

      showMessage(
        "هذا QR ليس بطاقة SALT PASS.",
        false
      );

      return;
    }


    scannedMemberId =
      memberId;


    stopScanner();


    document.getElementById(
      "customerName"
    ).innerText =
      "التحقق من العميل...";


    document.getElementById(
      "customerId"
    ).innerText =
      memberId;


    document.getElementById(
      "customer"
    ).style.display =
      "block";


    /*
      نرسل المستخدم مؤقتًا إلى Apps Script
      للتحقق من البطاقة.
    */

    const appsScriptUrl =
      "https://script.google.com/macros/s/AKfycbwLo29EjRRsz7w4EmFcgt3feOaCUhfYK1JpMhrquaaOHe7a8EEUVQ1T0v4j0AAiPTtz/exec";


    /*
      نفتح بطاقة العميل للتحقق منها.
      الخطوة التالية سنجعل Apps Script يعيد
      المستخدم إلى صفحة المحل مع بيانات العميل.
    */

    showStatus(
      "✅ تم قراءة QR العميل: " +
      memberId
    );


    document.getElementById(
      "confirmButton"
    ).style.display =
      "block";

  }


  // =================================================
  // إيقاف الكاميرا
  // =================================================

  function stopScanner(){

    if(
      scanner &&
      scannerRunning
    ){

      scanner.stop()

        .then(function(){

          scannerRunning =
            false;

        })

        .catch(function(){

          scannerRunning =
            false;

        });

    }

  }


  // =================================================
  // متابعة العملية
  // =================================================

  function continueToTransaction(){

    if(!scannedMemberId){

      showMessage(
        "لم يتم تحديد العميل.",
        false
      );

      return;
    }


    if(!selectedDiscount){

      showMessage(
        "اختر الخصم الذي استخدمه العميل أولًا.",
        false
      );

      return;
    }


    /*
      مؤقتًا نعرض النتيجة.
      في الخطوة التالية سنربط هذا مباشرة
      بدالة Apps Script التي تكتب في Transactions.
    */

    showMessage(
      "✅ العميل: " +
      scannedMemberId +
      "<br>" +
      "✅ الخصم: " +
      selectedDiscount +
      "<br><br>" +
      "الخطوة التالية: تسجيل العملية في Transactions.",
      true
    );

  }


  // =================================================
  // رسالة عادية
  // =================================================

  function showStatus(
    text
  ){

    const box =
      document.getElementById(
        "status"
      );


    box.innerText =
      text;

    box.className =
      "status";

  }


  // =================================================
  // رسالة نجاح / خطأ
  // =================================================

  function showMessage(
    text,
    success
  ){

    const box =
      document.getElementById(
        "message"
      );


    box.innerHTML =
      text;


    box.className =
      success
        ? "message success"
        : "message error";


    box.style.display =
      "block";

  }

</script>

</body>
</html>
