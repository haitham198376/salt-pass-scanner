<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>SALT PASS Scanner</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #f3f5f7;
  font-family: Arial, Tahoma, sans-serif;
  text-align: center;
  color: #111;
}

.container {
  width: 100%;
  max-width: 430px;
  margin: auto;
}

.header {
  background: #111;
  color: white;
  padding: 24px 15px;
  border-radius: 22px;
  margin-bottom: 15px;
}

.logo {
  font-size: 29px;
  font-weight: 800;
  letter-spacing: 2px;
}

.shop {
  font-size: 20px;
  margin-top: 8px;
}

.offer {
  color: #bbb;
  font-size: 14px;
  margin-top: 7px;
  line-height: 1.6;
}

.card {
  background: white;
  padding: 22px 16px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.title {
  font-size: 19px;
  font-weight: bold;
}

.text {
  margin-top: 9px;
  color: #666;
  font-size: 13px;
  line-height: 1.8;
}

.camera-button {
  display: block;
  width: 100%;
  padding: 18px;
  margin-top: 20px;
  border-radius: 14px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.camera-input {
  display: none;
}

.status {
  margin-top: 15px;
  background: #f7f7f7;
  padding: 13px;
  border-radius: 12px;
  color: #666;
  font-size: 13px;
  line-height: 1.7;
}

.error {
  display: none;
  margin-top: 13px;
  padding: 13px;
  background: #ffebee;
  color: #c62828;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.7;
}

#preview {
  display: none;
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 14px;
  background: #eee;
}

#result {
  display: none;
  margin-top: 15px;
  background: #f1f8e9;
  padding: 24px 18px;
  border-radius: 18px;
}

.success {
  color: #2e7d32;
  font-size: 21px;
  font-weight: bold;
}

.member-id {
  font-size: 28px;
  font-weight: bold;
  margin: 15px 0;
}

.offer-result {
  font-size: 16px;
  font-weight: bold;
  line-height: 1.7;
}

button {
  width: 100%;
  border: none;
  border-radius: 13px;
  padding: 16px;
  margin-top: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.confirm {
  background: #111;
  color: white;
}

.retry {
  background: #e6e6e6;
  color: #111;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div id="shopName" class="shop">
      جاري تحميل المحل...
    </div>

    <div id="offerTitle" class="offer">
      جاري تحميل العرض...
    </div>

  </div>


  <div id="scannerCard" class="card">

    <div class="title">
      📷 مسح بطاقة العميل
    </div>

    <div class="text">
      اضغط الزر لفتح كاميرا الهاتف والتقاط صورة QR البطاقة.
    </div>

    <label
      for="cameraInput"
      class="camera-button">

      📷 التقاط صورة QR

    </label>

    <input
      id="cameraInput"
      class="camera-input"
      type="file"
      accept="image/*"
      capture="environment">


    <div
      id="status"
      class="status">

      جاهز لالتقاط صورة QR.

    </div>


    <img
      id="preview"
      alt="QR">


    <div
      id="error"
      class="error">
    </div>


    <button
      class="retry"
      onclick="goBack()">

      رجوع

    </button>

  </div>


  <div id="result">

    <div class="success">
      ✅ تم قراءة بطاقة العميل
    </div>

    <div
      id="memberId"
      class="member-id">
    </div>

    <div>
      العرض:
    </div>

    <div
      id="resultOffer"
      class="offer-result">
    </div>

    <button
      class="confirm"
      onclick="confirmOffer()">

      ✅ تأكيد تنفيذ العرض

    </button>

    <button
      class="retry"
      onclick="retry()">

      🔄 مسح بطاقة أخرى

    </button>

  </div>

</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let scannedMemberId = "";


document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// STATUS / ERROR
// =====================================================

function setStatus(text) {

  document.getElementById(
    "status"
  ).innerText = text;

}


function showError(text) {

  const el =
    document.getElementById(
      "error"
    );

  el.innerText = text;

  el.style.display = "block";

}


function hideError() {

  const el =
    document.getElementById(
      "error"
    );

  el.innerText = "";

  el.style.display = "none";

}


// =====================================================
// CHECK
// =====================================================

function checkParams() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return false;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return false;

  }


  return true;

}


// =====================================================
// MEMBER ID
// =====================================================

function extractMemberId(text) {

  const value =
    String(
      text || ""
    ).trim();


  if (
    /^SP-\d+$/i.test(
      value
    )
  ) {

    return value.toUpperCase();

  }


  try {

    const url =
      new URL(value);


    const card =
      url.searchParams.get(
        "card"
      );


    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch (e) {}


  const match =
    value.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// IMAGE LOAD
// =====================================================

function loadImage(
  file
) {

  return new Promise(
    function(resolve, reject) {

      const image =
        new Image();


      const url =
        URL.createObjectURL(
          file
        );


      image.onload =
        function() {

          URL.revokeObjectURL(
            url
          );

          resolve(image);

        };


      image.onerror =
        function() {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "image-load-error"
            )
          );

        };


      image.src =
        url;

    }
  );

}


// =====================================================
// NATIVE BARCODE DETECTOR
// =====================================================

async function nativeDetect(
  file
) {

  if (
    !("BarcodeDetector" in window)
  ) {

    return "";

  }


  try {

    let supported = [];


    if (
      BarcodeDetector
        .getSupportedFormats
    ) {

      supported =
        await BarcodeDetector
          .getSupportedFormats();

    }


    if (
      supported.length &&
      !supported.includes("qr_code")
    ) {

      return "";

    }


    const detector =
      new BarcodeDetector({
        formats: ["qr_code"]
      });


    /*
      نضع مهلة حتى لا يبقى النظام
      على "جاري المعالجة" للأبد.
    */

    const detection =
      Promise.race([

        detector.detect(file),

        new Promise(
          function(_, reject) {

            setTimeout(
              function() {

                reject(
                  new Error(
                    "detector-timeout"
                  )
                );

              },
              4000
            );

          }
        )

      ]);


    const barcodes =
      await detection;


    if (
      !barcodes ||
      !barcodes.length
    ) {

      return "";

    }


    return (
      barcodes[0].rawValue
      || ""
    );

  } catch (error) {

    console.log(
      "Native detector unavailable:",
      error
    );

    return "";

  }

}


// =====================================================
// FALLBACK: HTML5 QR CODE
// =====================================================

async function fallbackDecode(
  file
) {

  /*
    تحميل المكتبة فقط عند الحاجة.
  */

  if (
    !window.Html5Qrcode
  ) {

    await loadScript(
      "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    );

  }


  if (
    !window.Html5Qrcode
  ) {

    return "";

  }


  const reader =
    document.createElement(
      "div"
    );


  reader.id =
    "hiddenQrReader";


  reader.style.display =
    "none";


  document.body.appendChild(
    reader
  );


  const scanner =
    new Html5Qrcode(
      "hiddenQrReader"
    );


  try {

    /*
      مهلة 6 ثوانٍ.
      إذا لم يقرأ الصورة لا يعلق البرنامج.
    */

    const result =
      await Promise.race([

        scanner.scanFile(
          file,
          true
        ),

        new Promise(
          function(_, reject) {

            setTimeout(
              function() {

                reject(
                  new Error(
                    "scan-timeout"
                  )
                );

              },
              6000
            );

          }
        )

      ]);


    return result || "";

  } catch (error) {

    console.log(
      "Fallback decoder:",
      error
    );

    return "";

  } finally {

    try {

      await scanner.clear();

    } catch(e) {}


    reader.remove();

  }

}


// =====================================================
// LOAD SCRIPT
// =====================================================

function loadScript(
  src
) {

  return new Promise(
    function(resolve, reject) {

      const script =
        document.createElement(
          "script"
        );


      script.src =
        src;


      script.onload =
        resolve;


      script.onerror =
        reject;


      document.head.appendChild(
        script
      );

    }
  );

}


// =====================================================
// PROCESS PHOTO
// =====================================================

async function processPhoto(
  file
) {

  hideError();


  setStatus(
    "⏳ جاري قراءة QR..."
  );


  /*
    1) الطريقة الأصلية للمتصفح
  */

  let decoded =
    await nativeDetect(
      file
    );


  /*
    2) إذا لم تنجح،
       نستخدم قارئ احتياطي.
  */

  if (!decoded) {

    setStatus(
      "⏳ جاري تجربة طريقة قراءة احتياطية..."
    );


    decoded =
      await fallbackDecode(
        file
      );

  }


  /*
    3) النتيجة
  */

  const memberId =
    extractMemberId(
      decoded
    );


  if (
    memberId
  ) {

    scannedMemberId =
      memberId;


    document.getElementById(
      "scannerCard"
    ).style.display =
      "none";


    document.getElementById(
      "result"
    ).style.display =
      "block";


    document.getElementById(
      "memberId"
    ).innerText =
      scannedMemberId;


    setStatus(
      "✅ تم التعرف على البطاقة."
    );


    return;

  }


  setStatus(
    "لم يتم العثور على QR."
  );


  showError(

    "⚠️ لم تتم قراءة QR. " +
    "جرّب تصوير الرمز من قريب جدًا، واجعل المربع الأبيض والأسود ظاهرًا بالكامل."

  );

}


// =====================================================
// CAMERA IMAGE
// =====================================================

document.getElementById(
  "cameraInput"
).addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {

      return;

    }


    if (
      !checkParams()
    ) {

      return;

    }


    const preview =
      document.getElementById(
        "preview"
      );


    const previewUrl =
      URL.createObjectURL(
        file
      );


    preview.src =
      previewUrl;


    preview.style.display =
      "block";


    await processPhoto(
      file
    );


    /*
      نترك الصورة حتى يستطيع المستخدم
      التأكد من أنها واضحة.
    */

  }
);


// =====================================================
// CONFIRM
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const url =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    url;

}


// =====================================================
// RETRY
// =====================================================

function retry() {

  scannedMemberId =
    "";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "cameraInput"
  ).value =
    "";


  hideError();


  setStatus(
    "جاهز لالتقاط صورة QR."
  );

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  history.back();

}

</script>

</body>

</html>
