<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SALT PASS</title>

  <!-- مكتبة قراءة QR -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:20px;
      background:#f3f5f7;
      font-family:Arial,Tahoma,sans-serif;
      color:#111;
    }

    .container{
      width:100%;
      max-width:500px;
      margin:0 auto;
    }

    /* =========================================
       HEADER
       ========================================= */

    .header{
      background:#111;
      color:#fff;
      padding:28px 20px;
      border-radius:24px;
      text-align:center;
    }

    .logo{
      font-size:30px;
      font-weight:800;
      letter-spacing:2px;
    }

    .shop-name{
      margin-top:10px;
      font-size:24px;
      font-weight:bold;
    }

    .shop-id{
      margin-top:6px;
      color:#aaa;
      font-size:13px;
    }


    /* =========================================
       CARD
       ========================================= */

    .card{
      background:#fff;
      margin-top:15px;
      padding:20px;
      border-radius:20px;
      box-shadow:0 6px 20px rgba(0,0,0,.06);
    }

    .section-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:14px;
    }


    /* =========================================
       DISCOUNTS
       ========================================= */

    .discount{
      width:100%;
      border:none;
      background:#111;
      color:white;
      padding:18px;
      margin-top:10px;
      border-radius:15px;
      text-align:right;
      cursor:pointer;
      font-size:19px;
      font-weight:bold;
      transition:.2s;
    }

    .discount:hover{
      opacity:.9;
    }

    .discount.selected{
      outline:3px solid #777;
      transform:scale(1.01);
    }

    .discount-sub{
      margin-top:6px;
      color:#bbb;
      font-size:12px;
      font-weight:normal;
    }


    /* =========================================
       SCANNER
       ========================================= */

    .scan-button{
      width:100%;
      border:none;
      background:#111;
      color:#fff;
      padding:18px;
      border-radius:14px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    #reader{
      width:100%;
      margin-top:18px;
    }

    #reader video{
      width:100% !important;
      border-radius:16px;
    }

    #reader__dashboard_section{
      margin-top:10px;
    }

    #reader button{
      border-radius:10px !important;
    }


    /* =========================================
       STATUS
       ========================================= */

    .status{
      margin-top:14px;
      padding:13px;
      border-radius:12px;
      background:#f4f4f4;
      color:#666;
      line-height:1.8;
    }


    /* =========================================
       CUSTOMER
       ========================================= */

    .customer{
      display:none;
      margin-top:15px;
      padding:18px;
      background:#f7f7f7;
      border-radius:15px;
    }

    .customer-name{
      font-size:21px;
      font-weight:bold;
    }

    .customer-id{
      margin-top:7px;
      color:#666;
      font-size:14px;
    }


    /* =========================================
       SELECTED DISCOUNT
       ========================================= */

    .selected-box{
      display:none;
      margin-top:15px;
      padding:18px;
      background:#eef7ee;
      border-radius:15px;
    }

    .selected-label{
      color:#555;
    }

    .selected-discount{
      margin-top:8px;
      font-size:26px;
      font-weight:bold;
    }


    /* =========================================
       CONFIRM
       ========================================= */

    .confirm-button{
      display:none;
      width:100%;
      border:none;
      background:#111;
      color:white;
      padding:17px;
      border-radius:13px;
      margin-top:15px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }


    /* =========================================
       MESSAGE
       ========================================= */

    .message{
      display:none;
      margin-top:15px;
      padding:14px;
      border-radius:12px;
      line-height:1.8;
    }

    .success{
      background:#e9f7ec;
      color:#256b32;
    }

    .error{
      background:#ffecec;
      color:#b71c1c;
    }


    /* =========================================
       EMPTY
       ========================================= */

    .empty{
      padding:15px;
      background:#f6f6f6;
      color:#666;
      border-radius:13px;
      line-height:1.7;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- =========================================
       HEADER
       ========================================= -->

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div
      id="shopName"
      class="shop-name"
    >
      المحل
    </div>

    <div
      id="shopId"
      class="shop-id"
    >
    </div>

  </div>



  <!-- =========================================
       DISCOUNTS
       ========================================= -->

  <div class="card">

    <div class="section-title">
      الخصومات المتاحة
    </div>

    <div id="discounts"></div>

  </div>



  <!-- =========================================
       SCANNER
       ========================================= -->

  <div class="card">

    <div class="section-title">
      بطاقة العميل
    </div>

    <button
      class="scan-button"
      onclick="startScanner()"
    >
      📷 مسح بطاقة العميل
    </button>


    <div id="reader"></div>


    <div
      id="scanStatus"
      class="status"
    >
      اضغط على الزر لفتح كاميرا الهاتف ومسح QR العميل.
    </div>


    <!-- CUSTOMER -->

    <div
      id="customer"
      class="customer"
    >

      <div
        id="customerName"
        class="customer-name"
      >
      </div>

      <div
        id="customerId"
        class="customer-id"
      >
      </div>

    </div>


    <!-- SELECTED DISCOUNT -->

    <div
      id="selectedBox"
      class="selected-box"
    >

      <div class="selected-label">
        الخصم المختار:
      </div>

      <div
        id="selectedDiscount"
        class="selected-discount"
      >
      </div>

    </div>


    <!-- CONFIRM -->

    <button
      id="confirmButton"
      class="confirm-button"
      onclick="confirmTransaction()"
    >
      ✅ تأكيد استخدام الخصم
    </button>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    >
    </div>

  </div>

</div>



<script>


/* =====================================================
   إعدادات المحل
   ===================================================== */


/*
  رابط Google Apps Script الرئيسي.
  هذا هو نفس رابط الـ Web App المستخدم عندك.
*/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwLo29EjRRsz7w4EmFcgt3feOaCUhfYK1JpMhrquaaOHe7a8EEUVQ1T0v4j0AAiPTtz/exec";


/*
  قراءة بيانات الرابط.
*/

const params =
  new URLSearchParams(
    window.location.search
  );


/*
  Shop ID
*/

const SHOP_ID =
  params.get("shopId") || "";


/*
  اسم المحل
*/

const SHOP_NAME =
  params.get("shop") ||
  "";


/*
  الخصومات المرسلة بالرابط.
*/

const D1 =
  formatDiscount(
    params.get("d1")
  );

const D2 =
  formatDiscount(
    params.get("d2")
  );

const D3 =
  formatDiscount(
    params.get("d3")
  );


/*
  تجميع الخصومات.
*/

const discounts = [];


if(D1){
  discounts.push(D1);
}


if(D2){
  discounts.push(D2);
}


if(D3){
  discounts.push(D3);
}


/*
  متغيرات العملية.
*/

let scanner = null;

let scannerRunning = false;

let scannedMemberId = "";

let selectedDiscount = "";


/*
  عرض بيانات المحل.
*/

document.getElementById(
  "shopId"
).innerText =
  SHOP_ID;


document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "المحل";


renderDiscounts();



/* =====================================================
   تنسيق النسبة
   ===================================================== */

function formatDiscount(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "";
  }


  let text =
    String(value).trim();


  if(!text){

    return "";
  }


  /*
    إذا كانت مكتوبة أصلًا:
    15%
    20%
    30%
  */

  if(
    text.includes("%")
  ){

    return text;
  }


  /*
    إذا كانت رقمًا مثل:
    0.15
  */

  let num =
    parseFloat(
      text.replace(
        ",",
        "."
      )
    );


  if(
    !isNaN(num) &&
    num > 0 &&
    num < 1
  ){

    return (
      Math.round(
        num * 100
      ) + "%"
    );
  }


  /*
    إذا كانت:
    15
    20
    30
  */

  if(
    !isNaN(num) &&
    num >= 1 &&
    num < 100
  ){

    return (
      Math.round(num) +
      "%"
    );
  }


  return text;
}



/* =====================================================
   عرض الخصومات
   ===================================================== */

function renderDiscounts(){

  const box =
    document.getElementById(
      "discounts"
    );


  box.innerHTML = "";


  if(
    discounts.length === 0
  ){

    box.innerHTML = `

      <div class="empty">
        لا توجد خصومات مضافة لهذا المحل حاليًا.
      </div>

    `;

    return;
  }


  discounts.forEach(
    function(discount){

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "discount";


      button.innerHTML = `

        <div>
          خصم ${escapeHtml(discount)}
        </div>

        <div class="discount-sub">
          اضغط لاختيار هذا الخصم
        </div>

      `;


      button.onclick =
        function(){

          selectDiscount(
            discount,
            button
          );

        };


      box.appendChild(
        button
      );

    }
  );

}



/* =====================================================
   اختيار الخصم
   ===================================================== */

function selectDiscount(
  discount,
  button
){

  if(!scannedMemberId){

    showMessage(
      "قم بمسح بطاقة العميل أولًا.",
      false
    );

    return;
  }


  selectedDiscount =
    discount;


  document
    .querySelectorAll(
      ".discount"
    )
    .forEach(
      function(item){

        item.classList.remove(
          "selected"
        );

      }
    );


  button.classList.add(
    "selected"
  );


  document.getElementById(
    "selectedDiscount"
  ).innerText =
    "خصم " + discount;


  document.getElementById(
    "selectedBox"
  ).style.display =
    "block";


  document.getElementById(
    "confirmButton"
  ).style.display =
    "block";


  document.getElementById(
    "selectedBox"
  ).scrollIntoView({
    behavior:"smooth"
  });

}



/* =====================================================
   تشغيل الماسح
   ===================================================== */

function startScanner(){

  if(scannerRunning){

    return;
  }


  hideMessage();


  document.getElementById(
    "scanStatus"
  ).innerText =
    "⏳ جاري تشغيل الكاميرا...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scannerRunning =
    true;


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }

    },

    function(decodedText){

      handleScan(
        decodedText
      );

    },

    function(errorMessage){

      /*
        نتجاهل أخطاء القراءة المؤقتة.
      */

    }

  )

  .then(function(){

    document.getElementById(
      "scanStatus"
    ).innerText =
      "📷 وجّه الكاميرا إلى QR الموجود على بطاقة العميل.";

  })

  .catch(function(error){

    scannerRunning =
      false;


    showMessage(
      "تعذر تشغيل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا.",
      false
    );

  });

}



/* =====================================================
   معالجة QR
   ===================================================== */

function handleScan(
  decodedText
){

  let memberId =
    "";


  /*
    QR بطاقة العميل يحتوي رابطًا مثل:

    .../exec?member=SP-0001
  */


  try{

    const url =
      new URL(
        decodedText
      );


    memberId =
      url.searchParams.get(
        "member"
      ) ||
      url.searchParams.get(
        "card"
      ) ||
      "";

  }

  catch(error){

    /*
      إذا كان QR نفسه مجرد SP-0001
    */

    memberId =
      String(
        decodedText || ""
      ).trim();

  }


  /*
    نتأكد أنه Member ID.
  */

  if(
    !/^SP-\d+$/i.test(
      memberId
    )
  ){

    showMessage(
      "هذا QR ليس بطاقة SALT PASS صالحة.",
      false
    );

    return;
  }


  scannedMemberId =
    memberId;


  stopScanner();


  /*
    إظهار رقم العضوية مباشرة.
  */

  document.getElementById(
    "customerName"
  ).innerText =
    "جاري التحقق من البطاقة...";


  document.getElementById(
    "customerId"
  ).innerText =
    "Member ID: " +
    memberId;


  document.getElementById(
    "customer"
  ).style.display =
    "block";


  document.getElementById(
    "scanStatus"
  ).innerText =
    "⏳ جاري التحقق من بطاقة العميل...";


  /*
    التحقق من العميل عن طريق Apps Script.
  */

  const verifyUrl =
    APPS_SCRIPT_URL +
    "?verifyMember=" +
    encodeURIComponent(
      memberId
    );


  /*
    فتح رابط التحقق في الخلفية
    باستخدام iframe مخفي.
  */

  verifyMember(
    memberId
  );

}



/* =====================================================
   التحقق من العميل
   ===================================================== */

function verifyMember(
  memberId
){

  /*
    نستخدم Apps Script Web App.
    التطبيق يعيد صفحة HTML بسيطة،
    لذلك هنا نستخدم fetch.
  */

  const url =
    APPS_SCRIPT_URL +
    "?verifyMember=" +
    encodeURIComponent(
      memberId
    );


  fetch(
    url,
    {
      method:"GET",
      mode:"cors",
      cache:"no-store"
    }
  )

  .then(
    function(response){

      return response.text();

    }
  )

  .then(
    function(text){

      /*
        في حال أعاد Apps Script
        البيانات كنص JSON.
      */

      try{

        const member =
          JSON.parse(
            text
          );


        if(
          !member ||
          !member.id
        ){

          showMessage(
            "بطاقة العميل غير موجودة.",
            false
          );

          return;
        }


        if(
          String(
            member.status
          ).toUpperCase()
          !==
          "ACTIVE"
        ){

          showMessage(
            "بطاقة العميل غير فعالة.",
            false
          );

          return;
        }


        document.getElementById(
          "customerName"
        ).innerText =
          member.name;


        document.getElementById(
          "customerId"
        ).innerText =
          "Member ID: " +
          member.id;


        document.getElementById(
          "scanStatus"
        ).innerText =
          "✅ تم التعرف على العميل بنجاح.";


      }

      catch(error){

        /*
          إذا لم يرجع JSON،
          نعتبر أن القراءة نفسها ناجحة.
        */

        document.getElementById(
          "customerName"
        ).innerText =
          "العميل " +
          memberId;


        document.getElementById(
          "customerId"
        ).innerText =
          "Member ID: " +
          memberId;


        document.getElementById(
          "scanStatus"
        ).innerText =
          "✅ تم قراءة بطاقة العميل.";

      }

    }
  )

  .catch(
    function(error){

      /*
        إذا منع المتصفح الطلب بسبب CORS،
        نعرض العميل المقروء.
        وسيتم التحقق النهائي عند تسجيل العملية.
      */

      document.getElementById(
        "customerName"
      ).innerText =
        "العميل " +
        memberId;


      document.getElementById(
        "customerId"
      ).innerText =
        "Member ID: " +
        memberId;


      document.getElementById(
        "scanStatus"
      ).innerText =
        "✅ تم قراءة بطاقة العميل.";

    }
  );

}



/* =====================================================
   إيقاف الكاميرا
   ===================================================== */

function stopScanner(){

  if(
    scanner &&
    scannerRunning
  ){

    scanner.stop()

      .then(
        function(){

          scannerRunning =
            false;

        }
      )

      .catch(
        function(){

          scannerRunning =
            false;

        }
      );

  }

}



/* =====================================================
   تأكيد العملية
   ===================================================== */

function confirmTransaction(){

  if(!scannedMemberId){

    showMessage(
      "لم يتم تحديد العميل.",
      false
    );

    return;
  }


  if(!selectedDiscount){

    showMessage(
      "اختر الخصم أولًا.",
      false
    );

    return;
  }


  /*
    زر التأكيد
  */

  const button =
    document.getElementById(
      "confirmButton"
    );


  button.disabled =
    true;


  button.innerText =
    "⏳ جاري تسجيل العملية...";


  showMessage(
    "⏳ جاري تسجيل العملية في النظام...",
    true
  );


  /*
    رابط تسجيل العملية.
  */

  const transactionUrl =
    APPS_SCRIPT_URL +

    "?action=record" +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&discount=" +
    encodeURIComponent(
      selectedDiscount
    );


  /*
    ننتقل إلى Apps Script
    لتسجيل العملية.
  */

  window.location.href =
    transactionUrl;

}



/* =====================================================
   إظهار رسالة
   ===================================================== */

function showMessage(
  text,
  success
){

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    text;


  box.className =
    success
      ? "message success"
      : "message error";


  box.style.display =
    "block";

}



/* =====================================================
   إخفاء الرسالة
   ===================================================== */

function hideMessage(){

  const box =
    document.getElementById(
      "message"
    );


  box.style.display =
    "none";

}



/* =====================================================
   حماية HTML
   ===================================================== */

function escapeHtml(
  value
){

  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>

</html>
