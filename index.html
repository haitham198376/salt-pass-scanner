<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>SALT PASS Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 25px 20px;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
    margin-bottom: 5px;
}

.shop {
    color: #666;
    margin-bottom: 20px;
}

.discount {
    font-size: 20px;
    font-weight: bold;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

#status {
    margin-top: 20px;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<h1>SALT PASS</h1>

<div class="shop">
ماسح بطاقة العميل
</div>

<div class="discount">
الخصم المختار:
<span id="discount"></span>
</div>

<div id="reader"></div>

<div id="status">
جاري تشغيل الكاميرا...
</div>

</div>


<script>

const params =
new URLSearchParams(window.location.search);

const discount =
params.get("discount") || "20%";

const returnUrl =
params.get("returnUrl");


document.getElementById("discount").innerText =
discount;


const scanner =
new Html5Qrcode("reader");


function success(decodedText) {

scanner.stop().then(function() {

document.getElementById("status").innerText =
"تمت قراءة البطاقة: " + decodedText;


/*
نرجع رقم العضوية إلى Google Apps Script
*/

if (returnUrl) {

const url =
returnUrl
+ "?memberId="
+ encodeURIComponent(decodedText)
+ "&discount="
+ encodeURIComponent(discount);

window.location.href = url;

}

});

}


function error(message) {

// أخطاء القراءة العادية لا نعرضها

}


scanner.start(

{
    facingMode: "environment"
},

{
    fps: 10,

    qrbox: {
        width: 250,
        height: 250
    }
},

success,

error

).catch(function(error) {

document.getElementById("status").innerText =
"❌ تعذر تشغيل الكاميرا.";

});

</script>

</body>

</html>
