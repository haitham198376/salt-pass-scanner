<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1">

<title>SALT PASS Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  background:
    #f3f5f7;

  color:
    #111;

  text-align:
    center;

  padding:
    15px;

}

.container {

  width:
    100%;

  max-width:
    430px;

  margin:
    0 auto;

}

.header {

  background:
    #111;

  color:
    white;

  border-radius:
    22px;

  padding:
    22px 15px;

  margin-bottom:
    15px;

}

.logo {

  font-size:
    28px;

  font-weight:
    800;

  letter-spacing:
    2px;

}

.shop {

  font-size:
    19px;

  margin-top:
    8px;

}

.offer {

  margin-top:
    8px;

  color:
    #bdbdbd;

  font-size:
    14px;

}


/* ===============================
   CAMERA BOX
   =============================== */

.scanner-card {

  background:
    white;

  border-radius:
    20px;

  padding:
    15px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}


/*
   مهم جدًا:
   جعل الماسح بعرض الشاشة
   وعدم السماح له بالخروج من المربع.
*/

#reader {

  width:
    100% !important;

  max-width:
    100%;

  margin:
    0 auto;

  overflow:
    hidden;

  border-radius:
    16px;

}


/* عناصر html5-qrcode */

#reader video {

  width:
    100% !important;

  max-width:
    100% !important;

  height:
    auto !important;

  display:
    block;

  object-fit:
    cover;

}


/* إخفاء عناصر اختيار الكاميرا غير الضرورية */

#reader__dashboard_section_swaplink {

  display:
    none !important;

}

#reader__dashboard_section_csr {

  width:
    100% !important;

}

#reader__dashboard_section_csr span {

  display:
    none !important;

}


/* =================================
   تعليمات
   ================================= */

.instruction {

  margin-top:
    15px;

  color:
    #666;

  font-size:
    14px;

  line-height:
    1.7;

}


/* =================================
   الأخطاء
   ================================= */

.error {

  color:
    #c62828;

  background:
    #ffebee;

  padding:
    12px;

  border-radius:
    12px;

  margin-top:
    15px;

  line-height:
    1.7;

  font-size:
    13px;

}


/* =================================
   النتيجة
   ================================= */

#result {

  display:
    none;

  background:
    #f1f8e9;

  border-radius:
    18px;

  padding:
    22px;

  margin-top:
    15px;

}

.success {

  color:
    #2e7d32;

}

.member-id {

  font-size:
    24px;

  font-weight:
    bold;

  margin:
    12px 0;

}

.offer-name {

  font-size:
    17px;

  font-weight:
    bold;

}

button {

  width:
    100%;

  border:
    none;

  border-radius:
    13px;

  padding:
    16px;

  margin-top:
    12px;

  font-size:
    17px;

  font-weight:
    bold;

  cursor:
    pointer;

}

.confirm {

  background:
    #111;

  color:
    white;

}

.cancel {

  background:
    #e5e5e5;

  color:
    #111;

}


/* =================================
   شاشة نجاح
   ================================= */

#completed {

  display:
    none;

  background:
    white;

  border-radius:
    18px;

  padding:
    25px;

  margin-top:
    15px;

}

.done {

  color:
    #2e7d32;

  font-size:
    22px;

  font-weight:
    bold;

}


@media (
  max-width: 380px
) {

  body {
    padding: 10px;
  }

  .header {
    padding: 19px 12px;
  }

  .logo {
    font-size: 25px;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- ======================================
     HEADER
     ====================================== -->

<div class="header">

<div class="logo">
SALT PASS
</div>

<div
id="shopName"
class="shop">

جاري تحميل اسم المحل...

</div>

<div
id="offerTitle"
class="offer">

جاري تحميل العرض...

</div>

</div>


<!-- ======================================
     SCANNER
     ====================================== -->

<div
id="scannerCard"
class="scanner-card">


<div class="instruction">

وجّه كاميرا الهاتف نحو QR بطاقة العميل

</div>


<div id="reader"></div>


<div
id="cameraError"
class="error"
style="display:none">

</div>


<button
class="cancel"
onclick="goBack()">

رجوع

</button>


</div>


<!-- ======================================
     RESULT
     ====================================== -->

<div id="result">


<div class="success">

✅ تم قراءة بطاقة العميل

</div>


<div
id="memberId"
class="member-id">

</div>


<div>

العرض:

</div>


<div
id="resultOffer"
class="offer-name">

</div>


<button
class="confirm"
onclick="confirmOffer()">

✅ تأكيد تنفيذ العرض

</button>


<button
class="cancel"
onclick="restartScanner()">

إلغاء وإعادة المسح

</button>


</div>


<!-- ======================================
     COMPLETED
     ====================================== -->

<div id="completed">

<div class="done">

✅ تمت العملية بنجاح

</div>

<p>
تم تسجيل استخدام العرض في SALT PASS.
</p>

<div id="transactionNumber"></div>

</div>


</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId")
  || "";


const SHOP_NAME =
  params.get("shop")
  || "";


const OFFER_ID =
  params.get("offerId")
  || "";


const OFFER_TITLE =
  params.get("offerTitle")
  || "";


const APPS_SCRIPT_URL =

  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


// =====================================================
// VARIABLES
// =====================================================

let scanner = null;

let scannedMemberId = "";


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// CHECK PARAMETERS
// =====================================================

function checkParameters() {

  if (!SHOP_ID) {

    showCameraError(
      "❌ لم يتم تحديد المحل."
    );

    return false;

  }


  if (!OFFER_ID) {

    showCameraError(
      "❌ لم يتم تحديد العرض."
    );

    return false;

  }


  return true;

}


// =====================================================
// START SCANNER
// =====================================================

function startScanner() {

  if (!checkParameters()) {
    return;
  }


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "completed"
  ).style.display =
    "none";


  try {

    if (scanner) {

      scanner.clear()
        .catch(
          function(){}
        );

    }

  } catch(e) {}


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        {
          exact:
            "environment"
        }
    },

    {

      fps:
        10,

      aspectRatio:
        1.0,

      qrbox:
        function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const minDimension =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );


          const size =
            Math.min(
              250,
              Math.floor(
                minDimension * 0.70
              )
            );


          return {
            width:
              size,

            height:
              size
          };

        }

    },

    function(decodedText) {

      handleScan(
        decodedText
      );

    },

    function(errorMessage) {

      // تجاهل أخطاء البحث العادية
      // لأنها تظهر أثناء تحريك الكاميرا.

    }

  )

  .catch(
    function(error) {

      console.error(
        error
      );


      showCameraError(

        "❌ تعذر فتح الكاميرا. " +

        "تأكد من إعطاء الموقع صلاحية استخدام الكاميرا."

      );

    }
  );

}


// =====================================================
// HANDLE SCAN
// =====================================================

function handleScan(
  decodedText
) {


  let memberId =
    String(
      decodedText || ""
    ).trim();


  /*
    البطاقة الحالية عندنا
    تحتوي على:

    SP-0006

    لكن هذه الدالة أيضًا تتعامل
    مع الحالات التي يكون فيها QR
    رابطًا كاملًا.
  */


  if (
    memberId.startsWith(
      "SP-"
    )
  ) {

    // الوضع الصحيح
    memberId =
      memberId;

  } else {

    try {

      const url =
        new URL(
          memberId
        );


      const card =
        url.searchParams.get(
          "card"
        );


      if (
        card &&
        card.startsWith(
          "SP-"
        )
      ) {

        memberId =
          card;

      } else {

        // البحث عن SP-XXXX داخل النص

        const match =
          memberId.match(
            /SP-\d+/i
          );


        if (
          match
        ) {

          memberId =
            match[0].toUpperCase();

        } else {

          showCameraError(
            "⚠️ تم قراءة QR لكنه ليس QR لبطاقة SALT PASS."
          );

          return;

        }

      }

    } catch(e) {

      const match =
        memberId.match(
          /SP-\d+/i
        );


      if (
        match
      ) {

        memberId =
          match[0].toUpperCase();

      } else {

        showCameraError(
          "⚠️ رمز QR غير صالح."
        );

        return;

      }

    }

  }


  scannedMemberId =
    memberId;


  stopScanner();


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;

}


// =====================================================
// STOP SCANNER
// =====================================================

function stopScanner() {

  try {

    if (
      scanner
    ) {

      scanner.stop()
        .catch(
          function(){}
        );

    }

  } catch(e) {}

}


// =====================================================
// CONFIRM OFFER
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  if (!OFFER_ID) {

    alert(
      "لم يتم تحديد العرض."
    );

    return;

  }


  if (!SHOP_ID) {

    alert(
      "لم يتم تحديد المحل."
    );

    return;

  }


  const finalUrl =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  /*
    الانتقال إلى Apps Script
    لتسجيل العملية في Transactions.
  */

  window.location.href =
    finalUrl;

}


// =====================================================
// RESTART
// =====================================================

function restartScanner() {

  scannedMemberId =
    "";

  document.getElementById(
    "result"
  ).style.display =
    "none";


  startScanner();

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  stopScanner();


  if (
    document.referrer
  ) {

    history.back();

  } else {

    window.location.href =
      "https://haitham198376.github.io/salt-pass-scanner/";

  }

}


// =====================================================
// ERROR
// =====================================================

function showCameraError(
  message
) {

  const error =
    document.getElementById(
      "cameraError"
    );


  error.innerText =
    message;


  error.style.display =
    "block";

}


// =====================================================
// START
// =====================================================

startScanner();

</script>

</body>

</html>
