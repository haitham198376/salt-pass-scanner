<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>SALT PASS</title>

  <!-- ZXing لقراءة QR من الصورة -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f3f5f7;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    .header {
      background: #111;
      color: white;
      padding: 24px 16px;
      border-radius: 22px;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .shop {
      font-size: 20px;
      margin-top: 9px;
    }

    .offer {
      color: #bbb;
      font-size: 14px;
      margin-top: 7px;
      line-height: 1.6;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .instruction {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.8;
    }

    .sub-instruction {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
      line-height: 1.7;
    }

    .camera-button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .camera-input {
      display: none;
    }

    .status {
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      background: #f7f7f7;
      color: #666;
      font-size: 13px;
      line-height: 1.7;
    }

    .error {
      display: none;
      margin-top: 13px;
      padding: 13px;
      border-radius: 12px;
      background: #ffebee;
      color: #c62828;
      font-size: 13px;
      line-height: 1.7;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 14px;
      background: #eee;
    }

    #result {
      display: none;
      margin-top: 15px;
      background: #f1f8e9;
      padding: 24px 18px;
      border-radius: 18px;
    }

    .success {
      color: #2e7d32;
      font-size: 21px;
      font-weight: bold;
    }

    .member-id {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    .offer-result {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm {
      background: #111;
      color: white;
    }

    .retry {
      background: #e7e7e7;
      color: #111;
    }

    .back {
      background: #e7e7e7;
      color: #111;
    }

  </style>

</head>

<body>

<div class="container">

  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div
      id="shopName"
      class="shop">
      جاري تحميل المحل...
    </div>

    <div
      id="offerTitle"
      class="offer">
      جاري تحميل العرض...
    </div>

  </div>


  <!-- ==========================================
       SCANNER
       ========================================== -->

  <div
    id="scannerCard"
    class="card">

    <div class="instruction">
      📷 التقط صورة لرمز QR الخاص بالعميل
    </div>

    <div class="sub-instruction">

      اضغط الزر، ثم صوّر QR البطاقة من قريب
      واجعله واضحًا وكاملًا داخل الصورة.

    </div>


    <!-- زر الكاميرا الأصلية -->

    <label
      for="cameraInput"
      class="camera-button">

      📷 التقاط صورة QR

    </label>


    <input
      id="cameraInput"
      class="camera-input"
      type="file"
      accept="image/*"
      capture="environment">


    <!-- حالة النظام -->

    <div
      id="status"
      class="status">

      جاهز لالتقاط صورة البطاقة.

    </div>


    <!-- الصورة -->

    <img
      id="preview"
      alt="صورة QR">


    <!-- الخطأ -->

    <div
      id="error"
      class="error">
    </div>


    <button
      class="back"
      onclick="goBack()">

      رجوع

    </button>

  </div>


  <!-- ==========================================
       RESULT
       ========================================== -->

  <div id="result">

    <div class="success">

      ✅ تم قراءة بطاقة العميل

    </div>


    <div
      id="memberId"
      class="member-id">
    </div>


    <div>
      العرض:
    </div>


    <div
      id="resultOffer"
      class="offer-result">
    </div>


    <button
      class="confirm"
      onclick="confirmOffer()">

      ✅ تأكيد تنفيذ العرض

    </button>


    <button
      class="retry"
      onclick="retryScan()">

      🔄 مسح بطاقة أخرى

    </button>

  </div>

</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let scannedMemberId = "";

let codeReader = null;


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// STATUS
// =====================================================

function setStatus(
  message
) {

  document.getElementById(
    "status"
  ).innerText =
    message;

}


// =====================================================
// ERROR
// =====================================================

function showError(
  message
) {

  const error =
    document.getElementById(
      "error"
    );

  error.innerText =
    message;

  error.style.display =
    "block";

}


// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {

  const error =
    document.getElementById(
      "error"
    );

  error.innerText =
    "";

  error.style.display =
    "none";

}


// =====================================================
// INITIAL CHECK
// =====================================================

function checkParameters() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return false;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return false;

  }


  return true;

}


// =====================================================
// EXTRACT MEMBER ID
// =====================================================

function extractMemberId(
  value
) {

  const text =
    String(
      value || ""
    ).trim();


  // الحالة 1:
  // QR = SP-0006

  if (
    /^SP-\d+$/i.test(
      text
    )
  ) {

    return text.toUpperCase();

  }


  // الحالة 2:
  // QR يحتوي رابط البطاقة

  try {

    const url =
      new URL(
        text
      );


    const card =
      url.searchParams.get(
        "card"
      );


    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch (e) {}


  // الحالة 3:
  // SP-0006 موجود داخل النص

  const match =
    text.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// READ IMAGE WITH ZXING
// =====================================================

async function readImage(
  image
) {

  try {

    if (!codeReader) {

      codeReader =
        new ZXingBrowser.BrowserQRCodeReader();

    }


    /*
      المحاولة الأولى
    */

    try {

      const result =
        await codeReader.decodeFromImageElement(
          image
        );


      if (
        result &&
        result.text
      ) {

        return result.text;

      }

    } catch (firstError) {

      console.log(
        "First image decode failed:",
        firstError
      );

    }


    /*
      محاولة ثانية:
      إنشاء Canvas
    */

    const canvas =
      document.createElement(
        "canvas"
      );


    const maxWidth =
      1800;


    let width =
      image.naturalWidth;


    let height =
      image.naturalHeight;


    if (
      width > maxWidth
    ) {

      const ratio =
        maxWidth / width;


      width =
        maxWidth;


      height =
        Math.round(
          height * ratio
        );

    }


    canvas.width =
      width;


    canvas.height =
      height;


    const context =
      canvas.getContext(
        "2d"
      );


    context.drawImage(
      image,
      0,
      0,
      width,
      height
    );


    const canvasImage =
      new Image();


    canvasImage.src =
      canvas.toDataURL(
        "image/png"
      );


    await new Promise(
      function(resolve, reject) {

        canvasImage.onload =
          resolve;

        canvasImage.onerror =
          reject;

      }
    );


    try {

      const result2 =
        await codeReader.decodeFromImageElement(
          canvasImage
        );


      if (
        result2 &&
        result2.text
      ) {

        return result2.text;

      }

    } catch (secondError) {

      console.log(
        "Second image decode failed:",
        secondError
      );

    }


    return "";

  } catch (error) {

    console.error(
      "readImage error:",
      error
    );

    return "";

  }

}


// =====================================================
// IMAGE INPUT
// =====================================================

document.getElementById(
  "cameraInput"
).addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {

      return;

    }


    hideError();


    setStatus(
      "⏳ جاري معالجة صورة QR..."
    );


    const preview =
      document.getElementById(
        "preview"
      );


    const image =
      new Image();


    const objectUrl =
      URL.createObjectURL(
        file
      );


    preview.src =
      objectUrl;


    preview.style.display =
      "block";


    image.onload =
      async function() {

        try {

          const text =
            await readImage(
              image
            );


          if (!text) {

            setStatus(
              "لم يتم العثور على QR"
            );


            showError(

              "⚠️ لم نتمكن من قراءة QR. " +
              "أعد التصوير من مسافة أقرب، وتأكد أن QR كامل وواضح وغير مائل."

            );


            return;

          }


          const memberId =
            extractMemberId(
              text
            );


          if (!memberId) {

            setStatus(
              "QR غير صالح"
            );


            showError(
              "⚠️ تم العثور على QR لكنه ليس بطاقة SALT PASS."
            );


            return;

          }


          handleScan(
            memberId
          );


        } catch (error) {

          console.error(
            error
          );


          showError(
            "❌ حدث خطأ أثناء قراءة الصورة."
          );


          setStatus(
            "تعذر قراءة الصورة"
          );

        }

      };


    image.onerror =
      function() {

        showError(
          "❌ تعذر فتح الصورة."
        );

        setStatus(
          "تعذر فتح الصورة"
        );

      };

  }
);


// =====================================================
// HANDLE SCAN
// =====================================================

function handleScan(
  value
) {

  const memberId =
    extractMemberId(
      value
    ) || value;


  if (
    !/^SP-\d+$/i.test(
      memberId
    )
  ) {

    showError(
      "⚠️ رقم بطاقة غير صالح."
    );

    return;

  }


  scannedMemberId =
    memberId.toUpperCase();


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;


  setStatus(
    "✅ تم التعرف على البطاقة."
  );

}


// =====================================================
// CONFIRM OFFER
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const url =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    url;

}


// =====================================================
// RETRY
// =====================================================

function retryScan() {

  scannedMemberId =
    "";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "cameraInput"
  ).value =
    "";


  hideError();


  setStatus(
    "جاهز لالتقاط صورة جديدة."
  );

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  history.back();

}

</script>

</body>

</html>
