<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>SALT PASS Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  background: #f3f5f7;

  color: #111;

  text-align: center;

  padding: 12px;

}

.container {

  width: 100%;

  max-width: 430px;

  margin: 0 auto;

}

.header {

  background: #111;

  color: white;

  border-radius: 22px;

  padding: 22px 15px;

  margin-bottom: 14px;

}

.logo {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: 2px;

}

.shop {

  font-size: 19px;

  margin-top: 8px;

}

.offer {

  color: #bdbdbd;

  font-size: 14px;

  margin-top: 8px;

  line-height: 1.5;

}

.scanner-card {

  background: white;

  border-radius: 20px;

  padding: 12px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}

.instruction {

  color: #555;

  font-size: 14px;

  line-height: 1.7;

  margin-bottom: 12px;

}


/* =====================================
   QR SCANNER
   ===================================== */

#reader {

  width: 100% !important;

  max-width: 100% !important;

  margin: 0 auto;

  overflow: hidden;

  border-radius: 15px;

}

#reader video {

  width: 100% !important;

  max-width: 100% !important;

  height: auto !important;

  display: block;

  object-fit: cover;

}

#reader__dashboard {

  width: 100% !important;

}

#reader__dashboard_section {

  width: 100% !important;

}

#reader__dashboard_section_csr {

  width: 100% !important;

}

#reader__dashboard_section_csr button {

  width: 100%;

  margin-top: 8px;

}

#reader__scan_region {

  width: 100% !important;

}


/* =====================================
   ERROR
   ===================================== */

#error {

  display: none;

  background: #ffebee;

  color: #c62828;

  padding: 13px;

  border-radius: 12px;

  margin-top: 12px;

  line-height: 1.7;

  font-size: 13px;

}


/* =====================================
   RESULT
   ===================================== */

#result {

  display: none;

  background: #f1f8e9;

  border-radius: 18px;

  padding: 22px;

  margin-top: 15px;

}

.success {

  color: #2e7d32;

  font-weight: bold;

  font-size: 20px;

}

.member {

  font-size: 25px;

  font-weight: bold;

  margin: 15px 0;

}

.offerResult {

  font-size: 16px;

  font-weight: bold;

}


/* =====================================
   COMPLETED
   ===================================== */

#completed {

  display: none;

  background: white;

  border-radius: 18px;

  padding: 25px;

  margin-top: 15px;

}

.done {

  color: #2e7d32;

  font-size: 22px;

  font-weight: bold;

}


/* =====================================
   BUTTONS
   ===================================== */

button {

  width: 100%;

  border: none;

  border-radius: 13px;

  padding: 16px;

  margin-top: 12px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

.confirm {

  background: #111;

  color: white;

}

.back {

  background: #e5e5e5;

  color: #111;

}

</style>

</head>


<body>


<div class="container">


<!-- ===================================
     HEADER
     =================================== -->

<div class="header">

<div class="logo">
SALT PASS
</div>

<div
id="shopName"
class="shop">

جارٍ تحميل المحل...

</div>

<div
id="offerTitle"
class="offer">

جارٍ تحميل العرض...

</div>

</div>


<!-- ===================================
     SCANNER
     =================================== -->

<div
id="scannerCard"
class="scanner-card">

<div class="instruction">

وجّه كاميرا الهاتف نحو QR بطاقة العميل

</div>


<div id="reader"></div>


<div
id="error"
style="display:none">

</div>


<button
class="back"
onclick="goBack()">

رجوع

</button>

</div>


<!-- ===================================
     RESULT
     =================================== -->

<div id="result">

<div class="success">
✅ تم قراءة بطاقة العميل
</div>


<div
id="memberId"
class="member">
</div>


<div>
العرض:
</div>


<div
id="resultOffer"
class="offerResult">
</div>


<button
class="confirm"
onclick="confirmOffer()">

✅ تأكيد تنفيذ العرض

</button>


<button
class="back"
onclick="restartScanner()">

إعادة المسح

</button>

</div>


<!-- ===================================
     COMPLETED
     =================================== -->

<div id="completed">

<div class="done">
✅ تمت العملية بنجاح
</div>

<p>
تم تسجيل استخدام العرض بنجاح في SALT PASS.
</p>

<div id="transaction"></div>

</div>


</div>


<script>


// =====================================
// PARAMETERS
// =====================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =

  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let scanner = null;

let scannedMemberId = "";


// =====================================
// DISPLAY
// =====================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================
// ERROR DISPLAY
// =====================================

function showError(message) {

  const error =
    document.getElementById(
      "error"
    );

  error.innerText =
    message;

  error.style.display =
    "block";

}


// =====================================
// CHECK HTTPS
// =====================================

function checkEnvironment() {

  if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost"
  ) {

    showError(
      "❌ يجب فتح الماسح من رابط HTTPS."
    );

    return false;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "❌ المتصفح لا يدعم الوصول إلى الكاميرا."
    );

    return false;

  }


  return true;

}


// =====================================
// START SCANNER
// =====================================

async function startScanner() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return;

  }


  if (!checkEnvironment()) {

    return;

  }


  try {

    // التأكد من إمكانية الوصول للكاميرا

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "environment"
        },

        audio: false

      });


    // إيقاف الاختبار بعد التأكد

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


  } catch (error) {

    console.error(
      "Camera permission error:",
      error
    );


    showError(

      "❌ المتصفح سمح بالموقع، لكن لم يتمكن من تشغيل الكاميرا. " +
      "تأكد من عدم استخدام الكاميرا في تطبيق أو تبويب آخر."

    );


    return;

  }


  try {

    if (scanner) {

      try {

        await scanner.clear();

      } catch(e) {}

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    // =================================
    // الطريقة الأساسية
    // =================================

    try {

      await scanner.start(

        {
          facingMode: "environment"
        },

        {

          fps: 10,

          qrbox:
            function(
              width,
              height
            ) {

              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * 0.70
                );


              return {

                width:
                  Math.min(
                    size,
                    250
                  ),

                height:
                  Math.min(
                    size,
                    250
                  )

              };

            }

        },

        function(decodedText) {

          handleScan(
            decodedText
          );

        },

        function(errorMessage) {}

      );


    } catch (environmentError) {

      console.warn(
        "Environment camera failed:",
        environmentError
      );


      // =================================
      // محاولة ثانية
      // =================================

      const cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "لم يتم العثور على كاميرا."
        );

      }


      const cameraId =
        cameras[
          cameras.length - 1
        ].id;


      await scanner.start(

        cameraId,

        {

          fps: 10,

          qrbox:
            function(
              width,
              height
            ) {

              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * 0.70
                );


              return {

                width:
                  Math.min(
                    size,
                    250
                  ),

                height:
                  Math.min(
                    size,
                    250
                  )

              };

            }

        },

        function(decodedText) {

          handleScan(
            decodedText
          );

        },

        function(errorMessage) {}

      );

    }


  } catch (error) {

    console.error(
      "Scanner error:",
      error
    );


    showError(
      "❌ تعذر تشغيل الكاميرا. أغلق أي تطبيق يستخدم الكاميرا، ثم أعد تحميل الصفحة."
    );

  }

}


// =====================================
// HANDLE SCAN
// =====================================

function handleScan(
  decodedText
) {

  let value =
    String(
      decodedText || ""
    ).trim();


  if (
    value.startsWith(
      "SP-"
    )
  ) {

    scannedMemberId =
      value;

  } else {

    try {

      const url =
        new URL(
          value
        );


      const card =
        url.searchParams.get(
          "card"
        );


      if (
        card &&
        /^SP-\d+$/i.test(card)
      ) {

        scannedMemberId =
          card.toUpperCase();

      } else {

        const match =
          value.match(
            /SP-\d+/i
          );


        if (!match) {

          showError(
            "⚠️ رمز QR ليس بطاقة SALT PASS."
          );

          return;

        }


        scannedMemberId =
          match[0].toUpperCase();

      }

    } catch(e) {

      const match =
        value.match(
          /SP-\d+/i
        );


      if (!match) {

        showError(
          "⚠️ رمز QR غير صالح."
        );

        return;

      }


      scannedMemberId =
        match[0].toUpperCase();

    }

  }


  stopScanner();


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;

}


// =====================================
// STOP SCANNER
// =====================================

function stopScanner() {

  try {

    if (scanner) {

      scanner.stop()
        .catch(
          function(){}
        );

    }

  } catch(e) {}

}


// =====================================
// CONFIRM
// =====================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const finalUrl =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    finalUrl;

}


// =====================================
// RESTART
// =====================================

function restartScanner() {

  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "error"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  startScanner();

}


// =====================================
// BACK
// =====================================

function goBack() {

  stopScanner();

  history.back();

}


// =====================================
// START
// =====================================

startScanner();

</script>

</body>

</html>
