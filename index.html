<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>SALT PASS Scanner</title>

  <!-- QR decoder for images -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        Tahoma,
        sans-serif;

      background: #f3f5f7;

      color: #111;

      text-align: center;

      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ==============================
       HEADER
       ============================== */

    .header {
      background: #111;
      color: #fff;

      border-radius: 22px;

      padding: 22px 15px;

      margin-bottom: 14px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .shop {
      font-size: 19px;
      margin-top: 8px;
    }

    .offer {
      font-size: 14px;
      color: #bbb;
      margin-top: 7px;
      line-height: 1.5;
    }

    /* ==============================
       SCANNER CARD
       ============================== */

    .scanner-card {
      background: #fff;

      border-radius: 20px;

      padding: 13px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);
    }

    .instruction {
      color: #555;

      font-size: 14px;

      line-height: 1.7;

      margin-bottom: 12px;
    }

    /* ==============================
       LIVE CAMERA
       ============================== */

    .camera-wrap {
      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      background: #000;

      overflow: hidden;

      border-radius: 16px;
    }

    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      background: #000;

    }

    .scan-frame {

      position: absolute;

      width: 64%;

      aspect-ratio: 1 / 1;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      border:
        3px solid #fff;

      border-radius: 18px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.20);

    }

    /* ==============================
       FALLBACK CAMERA BUTTON
       ============================== */

    .fallback-box {

      display: none;

      background: #f7f7f7;

      border-radius: 16px;

      padding: 18px;

      margin-top: 14px;
    }

    .fallback-title {

      font-size: 16px;

      font-weight: bold;

      margin-bottom: 8px;
    }

    .fallback-text {

      font-size: 13px;

      color: #666;

      line-height: 1.7;

      margin-bottom: 14px;
    }

    .camera-input {

      display: none;
    }

    .camera-button {

      display: block;

      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 13px;

      background: #111;

      color: #fff;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    /* ==============================
       ERROR
       ============================== */

    .error {

      display: none;

      background: #ffebee;

      color: #c62828;

      padding: 12px;

      margin-top: 12px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.7;
    }

    /* ==============================
       RESULT
       ============================== */

    #result {

      display: none;

      margin-top: 15px;

      background: #f1f8e9;

      padding: 22px;

      border-radius: 18px;
    }

    .success {

      color: #2e7d32;

      font-size: 20px;

      font-weight: bold;
    }

    .member-id {

      font-size: 26px;

      font-weight: bold;

      margin: 15px 0;
    }

    .offer-result {

      font-size: 16px;

      font-weight: bold;

      line-height: 1.7;
    }

    /* ==============================
       BUTTONS
       ============================== */

    button {

      width: 100%;

      border: none;

      border-radius: 13px;

      padding: 16px;

      margin-top: 12px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    .confirm {

      background: #111;

      color: #fff;
    }

    .back {

      background: #e6e6e6;

      color: #111;
    }

    /* ==============================
       SMALL IMAGE AREA
       ============================== */

    #imagePreview {

      display: none;

      max-width: 100%;

      border-radius: 12px;

      margin-top: 12px;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div
      id="shopName"
      class="shop">
      جاري تحميل المحل...
    </div>

    <div
      id="offerTitle"
      class="offer">
      جاري تحميل العرض...
    </div>

  </div>


  <!-- ==========================================
       SCANNER
       ========================================== -->

  <div
    id="scannerCard"
    class="scanner-card">


    <div class="instruction">

      وجّه الكاميرا نحو QR بطاقة العميل

    </div>


    <!-- LIVE CAMERA -->

    <div
      id="liveCameraArea"
      class="camera-wrap">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-frame"></div>

    </div>


    <!-- FALLBACK -->

    <div
      id="fallbackBox"
      class="fallback-box">

      <div class="fallback-title">

        📷 استخدم كاميرا الهاتف

      </div>


      <div class="fallback-text">

        تعذر تشغيل الكاميرا المباشرة داخل الصفحة.
        اضغط الزر التالي لفتح كاميرا الهاتف
        والتقاط صورة للـQR.

      </div>


      <label
        for="cameraInput"
        class="camera-button">

        📷 التقاط صورة QR

      </label>


      <input
        id="cameraInput"
        class="camera-input"
        type="file"
        accept="image/*"
        capture="environment">

    </div>


    <!-- ERROR -->

    <div
      id="error"
      class="error">
    </div>


    <!-- PREVIEW -->

    <img
      id="imagePreview"
      alt="QR Preview">


    <button
      class="back"
      onclick="goBack()">

      رجوع

    </button>

  </div>


  <!-- ==========================================
       RESULT
       ========================================== -->

  <div id="result">

    <div class="success">

      ✅ تم قراءة بطاقة العميل

    </div>


    <div
      id="memberId"
      class="member-id">
    </div>


    <div>

      العرض:

    </div>


    <div
      id="resultOffer"
      class="offer-result">
    </div>


    <button
      class="confirm"
      onclick="confirmOffer()">

      ✅ تأكيد تنفيذ العرض

    </button>


    <button
      class="back"
      onclick="restart()">

      🔄 إعادة المسح

    </button>

  </div>


</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


/*
  حالات النظام:
  cameraStream = البث المباشر
  scanning = هل نبحث عن QR
  scannedMemberId = العضو الذي تمت قراءته
*/

let cameraStream = null;

let scanning = false;

let animationId = null;

let scannedMemberId = "";


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// ERROR
// =====================================================

function showError(message) {

  const element =
    document.getElementById(
      "error"
    );

  element.innerText =
    message;

  element.style.display =
    "block";

}


// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {

  const element =
    document.getElementById(
      "error"
    );

  element.style.display =
    "none";

  element.innerText =
    "";

}


// =====================================================
// CHECK PARAMETERS
// =====================================================

function checkParameters() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return false;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return false;

  }


  return true;

}


// =====================================================
// START LIVE CAMERA
// =====================================================

async function startLiveCamera() {

  hideError();


  if (
    !checkParameters()
  ) {

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    activateFallback(
      "المتصفح لا يدعم الكاميرا المباشرة داخل الصفحة."
    );

    return;

  }


  try {

    /*
      نستخدم الطريقة الأساسية المباشرة.
      لا نستخدم exact.
    */

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 1280
            }

          },

          audio: false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      cameraStream;


    await video.play();


    scanning =
      true;


    scanVideoFrame();


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    /*
      لا نوقف النظام.
      نعرض الحل الاحتياطي.
    */

    activateFallback(
      "تعذر تشغيل الكاميرا المباشرة داخل الصفحة."
    );

  }

}


// =====================================================
// LIVE QR SCANNING
// =====================================================

function scanVideoFrame() {

  if (!scanning) {

    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    context.drawImage(

      video,

      0,
      0,

      canvas.width,
      canvas.height

    );


    const imageData =
      context.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );


    if (
      typeof jsQR ===
      "function"
    ) {

      const code =
        jsQR(

          imageData.data,

          imageData.width,

          imageData.height,

          {

            inversionAttempts:
              "attemptBoth"

          }

        );


      if (
        code &&
        code.data
      ) {

        handleScan(
          code.data
        );

        return;

      }

    }

  }


  animationId =
    requestAnimationFrame(
      scanVideoFrame
    );

}


// =====================================================
// FALLBACK
// =====================================================

function activateFallback(
  message
) {

  stopCamera();


  const liveArea =
    document.getElementById(
      "liveCameraArea"
    );


  liveArea.style.display =
    "none";


  const fallback =
    document.getElementById(
      "fallbackBox"
    );


  fallback.style.display =
    "block";


  if (message) {

    showError(
      message
    );

  }

}


// =====================================================
// IMAGE CAMERA INPUT
// =====================================================

document.getElementById(
  "cameraInput"
).addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {

      return;

    }


    hideError();


    const image =
      new Image();


    const imageUrl =
      URL.createObjectURL(
        file
      );


    document.getElementById(
      "imagePreview"
    ).src =
      imageUrl;


    document.getElementById(
      "imagePreview"
    ).style.display =
      "block";


    image.onload =
      function() {

        try {

          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            image.naturalWidth;


          canvas.height =
            image.naturalHeight;


          const context =
            canvas.getContext(
              "2d",
              {
                willReadFrequently:
                  true
              }
            );


          context.drawImage(
            image,
            0,
            0
          );


          const imageData =
            context.getImageData(

              0,
              0,

              canvas.width,
              canvas.height

            );


          const code =
            jsQR(

              imageData.data,

              imageData.width,

              imageData.height,

              {

                inversionAttempts:
                  "attemptBoth"

              }

            );


          if (
            code &&
            code.data
          ) {

            handleScan(
              code.data
            );

          } else {

            showError(

              "⚠️ لم يتم العثور على QR. " +
              "قرّب البطاقة، اجعل QR واضحًا بالكامل، ثم أعد التقاط الصورة."

            );

          }

        } catch (error) {

          console.error(
            error
          );


          showError(
            "❌ تعذر قراءة صورة QR."
          );

        }

        URL.revokeObjectURL(
          imageUrl
        );

      };


    image.onerror =
      function() {

        URL.revokeObjectURL(
          imageUrl
        );


        showError(
          "❌ تعذر فتح الصورة."
        );

      };

  }
);


// =====================================================
// HANDLE QR
// =====================================================

function handleScan(
  value
) {

  const memberId =
    extractMemberId(
      value
    );


  if (!memberId) {

    showError(
      "⚠️ هذا QR ليس بطاقة SALT PASS."
    );

    return;

  }


  scannedMemberId =
    memberId;


  stopCamera();


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;

}


// =====================================================
// EXTRACT MEMBER ID
// =====================================================

function extractMemberId(
  value
) {

  const text =
    String(
      value || ""
    ).trim();


  /*
    QR مباشر:
    SP-0006
  */

  if (
    /^SP-\d+$/i.test(
      text
    )
  ) {

    return text.toUpperCase();

  }


  /*
    QR يحتوي رابط البطاقة
  */

  try {

    const url =
      new URL(
        text
      );


    const card =
      url.searchParams.get(
        "card"
      );


    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch (e) {}


  /*
    البحث داخل النص
  */

  const match =
    text.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// STOP CAMERA
// =====================================================

function stopCamera() {

  scanning =
    false;


  if (
    animationId
  ) {

    cancelAnimationFrame(
      animationId
    );

    animationId =
      null;

  }


  if (
    cameraStream
  ) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (video) {

    video.srcObject =
      null;

  }

}


// =====================================================
// CONFIRM OFFER
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const finalUrl =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    finalUrl;

}


// =====================================================
// RESTART
// =====================================================

function restart() {

  scannedMemberId =
    "";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "imagePreview"
  ).style.display =
    "none";


  /*
    حاول الكاميرا المباشرة من جديد.
    وإذا فشلت سيظهر fallback.
  */

  document.getElementById(
    "liveCameraArea"
  ).style.display =
    "block";


  document.getElementById(
    "fallbackBox"
  ).style.display =
    "none";


  startLiveCamera();

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  stopCamera();

  history.back();

}


// =====================================================
// START
// =====================================================

startLiveCamera();

</script>

</body>

</html>
