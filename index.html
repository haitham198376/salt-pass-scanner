<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>SALT PASS</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing:border-box;
}

body {

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  background:#f5f5f5;

  margin:0;

  padding:20px;

  text-align:center;

}

.container {

  max-width:430px;

  margin:20px auto;

  background:white;

  padding:30px 20px;

  border-radius:22px;

  box-shadow:
    0 4px 20px
    rgba(0,0,0,.08);

}

.logo {

  font-size:30px;

  font-weight:800;

  letter-spacing:2px;

}

.shop {

  color:#666;

  font-size:18px;

  margin-top:8px;

  margin-bottom:15px;

}

.offer {

  background:#f1f8e9;

  padding:15px;

  border-radius:14px;

  margin-bottom:20px;

  line-height:1.7;

}

.offerTitle {

  font-weight:bold;

  font-size:18px;

}

#reader {

  width:100%;

  margin-top:20px;

}

#cameraError {

  color:#c62828;

  margin-top:15px;

  line-height:1.7;

}

#result {

  display:none;

  background:#f1f8e9;

  padding:22px;

  border-radius:18px;

  margin-top:20px;

}

.button {

  width:100%;

  padding:16px;

  margin-top:12px;

  border:none;

  border-radius:13px;

  font-size:17px;

  font-weight:bold;

}

.confirm {

  background:#111;

  color:white;

}

.back {

  background:#eee;

  color:#111;

}

</style>

</head>

<body>

<div class="container">


<div class="logo">
SALT PASS
</div>


<div
id="shopName"
class="shop">
</div>


<div
id="offerBox"
class="offer">

<div
id="offerTitle"
class="offerTitle">
</div>

</div>


<div id="scannerArea">

<p>
وجّه كاميرا الهاتف نحو QR بطاقة العميل
</p>

<div id="reader"></div>

<div
id="cameraError">
</div>

<button
class="button back"
onclick="goBack()">

رجوع

</button>

</div>


<div id="result">

<h2>
✅ تم قراءة البطاقة
</h2>

<p>

<strong>
رقم العضوية:
</strong>

<br>

<span id="memberId">
</span>

</p>

<p>

<strong>
العرض:
</strong>

<br>

<span id="resultOffer">
</span>

</p>


<button
class="button confirm"
onclick="confirmOffer()">

✅ تأكيد تنفيذ العرض

</button>


<button
class="button back"
onclick="goBack()">

إلغاء

</button>

</div>


</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId")
  || "";


const SHOP_NAME =
  params.get("shop")
  || "";


const OFFER_ID =
  params.get("offerId")
  || "";


const OFFER_TITLE =
  params.get("offerTitle")
  || "";


let scanner = null;

let scannedMember = "";


// =====================================================
// DISPLAY DATA
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME;


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE;


// =====================================================
// START CAMERA
// =====================================================

function startScanner() {


  if (!SHOP_ID) {

    document.getElementById(
      "cameraError"
    ).innerText =
      "❌ لم يتم تحديد المحل.";

    return;

  }


  if (!OFFER_ID) {

    document.getElementById(
      "cameraError"
    ).innerText =
      "❌ لم يتم تحديد العرض.";

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps:10,

      qrbox:{
        width:250,
        height:250
      }

    },

    function(decodedText) {


      scannedMember =
        decodedText.trim();


      scanner.stop()

        .then(function() {

          showResult();

        })

        .catch(function() {

          showResult();

        });

    },

    function(errorMessage) {

      // أخطاء المسح العادية يتم تجاهلها

    }

  )

  .catch(function(error) {


    document.getElementById(
      "cameraError"
    ).innerText =

      "❌ تعذر فتح الكاميرا. " +
      "تأكد من السماح للمتصفح باستخدام الكاميرا.";

  });

}


// =====================================================
// SHOW RESULT
// =====================================================

function showResult() {


  document.getElementById(
    "scannerArea"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMember;


  document.getElementById(
    "resultOffer"
  ).innerText =
    OFFER_TITLE;

}


// =====================================================
// CONFIRM OFFER
// =====================================================

function confirmOffer() {


  const appsScriptUrl =

    "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


  const finalUrl =

    appsScriptUrl +

    "?memberId=" +
    encodeURIComponent(
      scannedMember
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    finalUrl;

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  try {

    if (scanner) {

      scanner.stop()
        .catch(
          function(){}
        );

    }

  } catch(e) {}

  history.back();

}


// =====================================================
// START
// =====================================================

startScanner();

</script>

</body>

</html>
