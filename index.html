<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SALT PASS</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:20px;
      background:#f3f5f7;
      font-family:Arial,Tahoma,sans-serif;
      color:#111;
    }

    .container{
      width:100%;
      max-width:500px;
      margin:auto;
    }

    .header{
      background:#111;
      color:#fff;
      padding:28px 20px;
      border-radius:24px;
      text-align:center;
    }

    .logo{
      font-size:30px;
      font-weight:800;
      letter-spacing:2px;
    }

    .shop-name{
      margin-top:10px;
      font-size:24px;
      font-weight:bold;
    }

    .shop-id{
      margin-top:6px;
      color:#aaa;
      font-size:13px;
    }

    .card{
      background:#fff;
      margin-top:15px;
      padding:20px;
      border-radius:20px;
      box-shadow:0 6px 20px rgba(0,0,0,.06);
    }

    .section-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:14px;
    }

    .offer{
      width:100%;
      border:0;
      background:#111;
      color:#fff;
      padding:18px;
      margin-top:10px;
      border-radius:15px;
      text-align:right;
      cursor:pointer;
    }

    .offer.selected{
      outline:3px solid #777;
    }

    .offer-title{
      font-size:19px;
      font-weight:bold;
    }

    .offer-details{
      margin-top:7px;
      color:#bbb;
      font-size:13px;
      line-height:1.7;
    }

    .empty{
      padding:15px;
      background:#f6f6f6;
      color:#666;
      border-radius:13px;
      line-height:1.7;
    }

    .scan-button{
      width:100%;
      border:0;
      background:#111;
      color:#fff;
      padding:18px;
      border-radius:14px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    #reader{
      width:100%;
      margin-top:18px;
    }

    #reader video{
      width:100% !important;
      border-radius:16px;
    }

    #scanStatus{
      margin-top:14px;
      padding:13px;
      border-radius:12px;
      background:#f4f4f4;
      color:#666;
      line-height:1.8;
    }

    .customer{
      display:none;
      margin-top:15px;
      padding:18px;
      background:#f7f7f7;
      border-radius:15px;
    }

    .customer-name{
      font-size:21px;
      font-weight:bold;
    }

    .customer-id{
      margin-top:7px;
      color:#666;
      font-size:14px;
    }

    .selected-box{
      display:none;
      margin-top:15px;
      padding:18px;
      background:#eef7ee;
      border-radius:15px;
    }

    .selected-label{
      color:#555;
    }

    .selected-title{
      margin-top:8px;
      font-size:21px;
      font-weight:bold;
    }

    .confirm-button{
      display:none;
      width:100%;
      border:0;
      background:#111;
      color:#fff;
      padding:17px;
      border-radius:13px;
      margin-top:15px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    .message{
      display:none;
      margin-top:15px;
      padding:14px;
      border-radius:12px;
      line-height:1.8;
    }

    .success{
      background:#e9f7ec;
      color:#256b32;
    }

    .error{
      background:#ffecec;
      color:#b71c1c;
    }

    .loading{
      padding:15px;
      background:#f6f6f6;
      color:#666;
      border-radius:13px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div
      id="shopName"
      class="shop-name"
    >
      جاري تحميل المحل...
    </div>

    <div
      id="shopId"
      class="shop-id"
    >
    </div>

  </div>


  <!-- العروض -->

  <div class="card">

    <div class="section-title">
      العروض والخصومات
    </div>

    <div id="offers">
      <div class="loading">
        ⏳ جاري تحميل العروض...
      </div>
    </div>

  </div>


  <!-- العميل -->

  <div class="card">

    <div class="section-title">
      بطاقة العميل
    </div>

    <button
      id="scanButton"
      class="scan-button"
      onclick="startScanner()"
    >
      📷 مسح بطاقة العميل
    </button>

    <div id="reader"></div>

    <div id="scanStatus">
      اضغط على الزر لفتح الكاميرا ومسح QR العميل.
    </div>


    <div
      id="customer"
      class="customer"
    >

      <div
        id="customerName"
        class="customer-name"
      >
      </div>

      <div
        id="customerId"
        class="customer-id"
      >
      </div>

    </div>


    <div
      id="selectedBox"
      class="selected-box"
    >

      <div class="selected-label">
        العرض المختار:
      </div>

      <div
        id="selectedTitle"
        class="selected-title"
      >
      </div>

    </div>


    <button
      id="confirmButton"
      class="confirm-button"
      onclick="confirmTransaction()"
    >
      ✅ تأكيد استخدام العرض
    </button>


    <div
      id="message"
      class="message"
    >
    </div>

  </div>

</div>


<script>

/* =====================================================
   الإعدادات
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwLo29EjRRsz7w4EmFcgt3feOaCUhfYK1JpMhrquaaOHe7a8EEUVQ1T0v4j0AAiPTtz/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


/* =====================================================
   المتغيرات
   ===================================================== */

let offers = [];

let scanner = null;

let scannerRunning = false;

let scannedMemberId = "";

let scannedMemberName = "";

let selectedOffer = null;


/* =====================================================
   تحميل اسم المحل
   ===================================================== */

function loadShop(){

  document.getElementById(
    "shopId"
  ).innerText =
    SHOP_ID;


  /*
    نحاول جلب بيانات المحل من Apps Script
    عبر API بسيط.
  */

  const url =
    APPS_SCRIPT_URL +
    "?shopInfo=" +
    encodeURIComponent(
      SHOP_ID
    );


  fetch(
    url,
    {
      method:"GET",
      cache:"no-store"
    }
  )

  .then(
    function(response){
      return response.json();
    }
  )

  .then(
    function(data){

      if(
        data &&
        data.success &&
        data.name
      ){

        document.getElementById(
          "shopName"
        ).innerText =
          data.name;

      }

    }
  )

  .catch(
    function(){

      /*
        إذا لم تتوفر بيانات المحل من API،
        نستخدم الاسم الموجود بالرابط.
      */

      const urlShop =
        params.get("shop") || "المحل";

      document.getElementById(
        "shopName"
      ).innerText =
        urlShop;

    }
  );

}


/* =====================================================
   تحميل العروض من Offers
   ===================================================== */

function loadOffers(){

  const box =
    document.getElementById(
      "offers"
    );


  box.innerHTML = `

    <div class="loading">
      ⏳ جاري تحميل العروض...
    </div>

  `;


  const callbackName =
    "saltPassOffersCallback";


  window[
    callbackName
  ] =
    function(data){

      try{

        if(
          !data ||
          !data.success
        ){

          throw new Error(
            "تعذر تحميل العروض."
          );

        }


        offers =
          data.offers || [];


        renderOffers();

      }

      catch(error){

        box.innerHTML = `

          <div class="empty">
            ❌ ${escapeHtml(
              error.message ||
              "تعذر تحميل العروض."
            )}
          </div>

        `;

      }


      /*
        إزالة السكربت بعد التنفيذ
      */

      const script =
        document.getElementById(
          "offersApiScript"
        );


      if(script){

        script.remove();

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "offersApiScript";


  script.src =
    APPS_SCRIPT_URL +
    "?action=offers" +
    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.onerror =
    function(){

      box.innerHTML = `

        <div class="empty">
          ❌ تعذر الاتصال بنظام العروض.
        </div>

      `;

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   عرض العروض
   ===================================================== */

function renderOffers(){

  const box =
    document.getElementById(
      "offers"
    );


  box.innerHTML =
    "";


  if(
    !offers ||
    offers.length === 0
  ){

    box.innerHTML = `

      <div class="empty">
        لا توجد عروض متاحة حاليًا.
      </div>

    `;

    return;

  }


  offers.forEach(
    function(offer){

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "offer";


      button.onclick =
        function(){

          selectOffer(
            offer,
            button
          );

        };


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "offer-title";


      title.innerText =
        offer.title;


      const details =
        document.createElement(
          "div"
        );


      details.className =
        "offer-details";


      details.innerText =
        offer.details;


      button.appendChild(
        title
      );


      button.appendChild(
        details
      );


      box.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   اختيار العرض
   ===================================================== */

function selectOffer(
  offer,
  button
){

  if(
    !scannedMemberId
  ){

    showMessage(
      "قم بمسح بطاقة العميل أولًا.",
      false
    );

    return;

  }


  selectedOffer =
    offer;


  document
    .querySelectorAll(
      ".offer"
    )
    .forEach(
      function(item){

        item.classList.remove(
          "selected"
        );

      }
    );


  button.classList.add(
    "selected"
  );


  document.getElementById(
    "selectedTitle"
  ).innerText =
    offer.title;


  document.getElementById(
    "selectedBox"
  ).style.display =
    "block";


  document.getElementById(
    "confirmButton"
  ).style.display =
    "block";


  document.getElementById(
    "selectedBox"
  ).scrollIntoView({
    behavior:"smooth"
  });

}


/* =====================================================
   بدء الكاميرا
   ===================================================== */

function startScanner(){

  if(scannerRunning){

    return;

  }


  hideMessage();


  document.getElementById(
    "scanStatus"
  ).innerText =
    "⏳ جاري تشغيل الكاميرا...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scannerRunning =
    true;


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }

    },

    function(decodedText){

      handleScan(
        decodedText
      );

    },

    function(errorMessage){

      /*
        أخطاء القراءة المؤقتة يتم تجاهلها.
      */

    }

  )

  .then(
    function(){

      document.getElementById(
        "scanStatus"
      ).innerText =
        "📷 وجّه الكاميرا إلى QR بطاقة العميل.";

    }
  )

  .catch(
    function(error){

      scannerRunning =
        false;


      showMessage(
        "تعذر تشغيل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا.",
        false
      );

    }
  );

}


/* =====================================================
   قراءة QR العميل
   ===================================================== */

function handleScan(
  decodedText
){

  let memberId =
    "";


  try{

    const url =
      new URL(
        decodedText
      );


    memberId =
      url.searchParams.get(
        "member"
      ) ||
      url.searchParams.get(
        "card"
      ) ||
      "";

  }

  catch(error){

    memberId =
      String(
        decodedText || ""
      ).trim();

  }


  if(
    !/^SP-\d+$/i.test(
      memberId
    )
  ){

    showMessage(
      "هذا QR ليس بطاقة SALT PASS صالحة.",
      false
    );

    return;

  }


  scannedMemberId =
    memberId;


  stopScanner();


  document.getElementById(
    "customer"
  ).style.display =
    "block";


  document.getElementById(
    "customerName"
  ).innerText =
    "⏳ جاري التحقق من العميل...";


  document.getElementById(
    "customerId"
  ).innerText =
    "Member ID: " +
    memberId;


  document.getElementById(
    "scanStatus"
  ).innerText =
    "⏳ جاري التحقق من بطاقة العميل...";


  verifyMember(
    memberId
  );

}


/* =====================================================
   التحقق من العميل
   ===================================================== */

function verifyMember(
  memberId
){

  const callbackName =
    "saltPassMemberCallback";


  window[
    callbackName
  ] =
    function(data){

      if(
        !data ||
        !data.success
      ){

        document.getElementById(
          "customerName"
        ).innerText =
          "العميل غير موجود.";


        showMessage(
          data &&
          data.message
            ? data.message
            : "تعذر التحقق من العميل.",
          false
        );


        return;

      }


      scannedMemberId =
        data.id;


      scannedMemberName =
        data.name;


      document.getElementById(
        "customerName"
      ).innerText =
        data.name;


      document.getElementById(
        "customerId"
      ).innerText =
        "Member ID: " +
        data.id;


      document.getElementById(
        "scanStatus"
      ).innerText =
        "✅ تم التعرف على العميل بنجاح.";


      if(selectedOffer){

        document.getElementById(
          "confirmButton"
        ).style.display =
          "block";

      }


      const script =
        document.getElementById(
          "memberApiScript"
        );


      if(script){

        script.remove();

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "memberApiScript";


  script.src =
    APPS_SCRIPT_URL +
    "?verifyMember=" +
    encodeURIComponent(
      memberId
    ) +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.onerror =
    function(){

      showMessage(
        "تعذر الاتصال بالنظام للتحقق من البطاقة.",
        false
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   إيقاف الكاميرا
   ===================================================== */

function stopScanner(){

  if(
    scanner &&
    scannerRunning
  ){

    scanner.stop()

      .then(
        function(){

          scannerRunning =
            false;

        }
      )

      .catch(
        function(){

          scannerRunning =
            false;

        }
      );

  }

}


/* =====================================================
   تأكيد العملية
   ===================================================== */

function confirmTransaction(){

  if(
    !scannedMemberId
  ){

    showMessage(
      "لم يتم تحديد العميل.",
      false
    );

    return;

  }


  if(
    !selectedOffer ||
    !selectedOffer.id
  ){

    showMessage(
      "اختر العرض أولًا.",
      false
    );

    return;

  }


  const button =
    document.getElementById(
      "confirmButton"
    );


  button.disabled =
    true;


  button.innerText =
    "⏳ جاري تسجيل العملية...";


  showMessage(
    "⏳ جاري تسجيل العملية...",
    true
  );


  /*
    التسجيل باستخدام Offer ID الحقيقي.
  */

  const url =
    APPS_SCRIPT_URL +

    "?action=record" +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      selectedOffer.id
    );


  window.location.href =
    url;

}


/* =====================================================
   الرسائل
   ===================================================== */

function showMessage(
  text,
  success
){

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    text;


  box.className =
    success
      ? "message success"
      : "message error";


  box.style.display =
    "block";

}


function hideMessage(){

  document.getElementById(
    "message"
  ).style.display =
    "none";

}


/* =====================================================
   حماية HTML
   ===================================================== */

function escapeHtml(
  value
){

  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   بدء الصفحة
   ===================================================== */

loadShop();

loadOffers();

</script>

</body>

</html>
