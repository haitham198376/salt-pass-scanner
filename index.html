<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SALT PASS Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f3f5f7;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    .header {
      background: #111;
      color: #fff;
      padding: 22px 15px;
      border-radius: 22px;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .shop {
      margin-top: 8px;
      font-size: 19px;
    }

    .offer {
      margin-top: 7px;
      color: #bbb;
      font-size: 14px;
    }

    .box {
      background: #fff;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .instruction {
      color: #555;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    #reader {
      width: 100%;
      margin: auto;
      overflow: hidden;
      border-radius: 15px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    #error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #ffebee;
      color: #c62828;
      line-height: 1.7;
      font-size: 13px;
    }

    #result {
      display: none;
      margin-top: 15px;
      background: #f1f8e9;
      border-radius: 18px;
      padding: 22px;
    }

    .success {
      color: #2e7d32;
      font-size: 20px;
      font-weight: bold;
    }

    .member {
      margin: 14px 0;
      font-size: 25px;
      font-weight: bold;
    }

    .offer-result {
      font-size: 16px;
      font-weight: bold;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm {
      background: #111;
      color: #fff;
    }

    .back {
      background: #e8e8e8;
      color: #111;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">SALT PASS</div>

    <div id="shopName" class="shop">
      جاري تحميل المحل...
    </div>

    <div id="offerTitle" class="offer">
      جاري تحميل العرض...
    </div>
  </div>


  <div id="scannerBox" class="box">

    <div class="instruction">
      وجّه كاميرا الهاتف نحو QR بطاقة العميل
    </div>

    <div id="reader"></div>

    <div id="error"></div>

    <button
      class="back"
      onclick="goBack()">
      رجوع
    </button>

  </div>


  <div id="result">

    <div class="success">
      ✅ تم قراءة بطاقة العميل
    </div>

    <div
      id="memberId"
      class="member">
    </div>

    <div>
      العرض:
    </div>

    <div
      id="resultOffer"
      class="offer-result">
    </div>

    <button
      class="confirm"
      onclick="confirmOffer()">
      ✅ تأكيد تنفيذ العرض
    </button>

    <button
      class="back"
      onclick="restart()">
      🔄 إعادة المسح
    </button>

  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let html5QrCode = null;

let scannedMemberId = "";


// =====================================================
// عرض البيانات
// =====================================================

document.getElementById("shopName").innerText =
  SHOP_NAME || "SALT PASS";

document.getElementById("offerTitle").innerText =
  OFFER_TITLE || "العرض";

document.getElementById("resultOffer").innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// إظهار الخطأ
// =====================================================

function showError(message) {

  const error =
    document.getElementById("error");

  error.innerText =
    message;

  error.style.display =
    "block";
}


// =====================================================
// استخراج SP-XXXX
// =====================================================

function extractMemberId(text) {

  const value =
    String(text || "").trim();


  // QR مباشر:
  // SP-0006

  if (
    /^SP-\d+$/i.test(value)
  ) {

    return value.toUpperCase();

  }


  // إذا كان QR يحتوي رابطًا

  try {

    const url =
      new URL(value);

    const card =
      url.searchParams.get("card");

    if (
      card &&
      /^SP-\d+$/i.test(card)
    ) {

      return card.toUpperCase();

    }

  } catch (e) {}


  // بحث داخل النص

  const match =
    value.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// بدء الكاميرا
// =====================================================

async function startScanner() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return;

  }


  try {

    if (html5QrCode) {

      try {
        await html5QrCode.stop();
      } catch (e) {}

      try {
        await html5QrCode.clear();
      } catch (e) {}

    }


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    /*
      نستخدم facingMode كنص عادي،
      بدون exact.
    */

    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 220,
          height: 220
        },

        aspectRatio: 1.0
      },

      function(decodedText) {

        onScanSuccess(
          decodedText
        );

      },

      function(errorMessage) {

        // يتم تجاهل أخطاء البحث العادية

      }

    );


  } catch (error) {

    console.error(
      error
    );


    showError(
      "❌ لم يتمكن ماسح SALT PASS من تشغيل الكاميرا."
    );

  }

}


// =====================================================
// نجاح القراءة
// =====================================================

async function onScanSuccess(
  decodedText
) {

  const memberId =
    extractMemberId(
      decodedText
    );


  if (!memberId) {

    showError(
      "⚠️ رمز QR ليس بطاقة SALT PASS صالحة."
    );

    return;

  }


  scannedMemberId =
    memberId;


  try {

    if (html5QrCode) {

      await html5QrCode.stop();

    }

  } catch (e) {}


  document.getElementById(
    "scannerBox"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;

}


// =====================================================
// تأكيد العرض
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const finalUrl =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    finalUrl;

}


// =====================================================
// إعادة المسح
// =====================================================

async function restart() {

  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerBox"
  ).style.display =
    "block";


  document.getElementById(
    "error"
  ).style.display =
    "none";


  scannedMemberId =
    "";


  await startScanner();

}


// =====================================================
// رجوع
// =====================================================

function goBack() {

  try {

    if (html5QrCode) {

      html5QrCode.stop()
        .catch(
          function(){}
        );

    }

  } catch (e) {}


  history.back();

}


// =====================================================
// البداية
// =====================================================

startScanner();

</script>

</body>
</html>
