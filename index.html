<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1">

<title>SALT PASS Scanner</title>

<!-- QR decoder -->
<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>

<style>

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body {

  background:#f3f5f7;

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  text-align:center;

  padding:12px;

  color:#111;

}

.container {

  width:100%;

  max-width:430px;

  margin:auto;

}

/* ==========================================
   HEADER
   ========================================== */

.header {

  background:#111;

  color:white;

  padding:22px 15px;

  border-radius:22px;

  margin-bottom:14px;

}

.logo {

  font-size:28px;

  font-weight:800;

  letter-spacing:2px;

}

.shop {

  font-size:19px;

  margin-top:8px;

}

.offer-title {

  color:#bbb;

  font-size:14px;

  margin-top:7px;

  line-height:1.5;

}

/* ==========================================
   MAIN CARD
   ========================================== */

.card {

  background:white;

  border-radius:20px;

  padding:15px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}

/* ==========================================
   LIVE CAMERA
   ========================================== */

.camera-box {

  position:relative;

  width:100%;

  aspect-ratio:1 / 1;

  background:#000;

  border-radius:16px;

  overflow:hidden;

}

#video {

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  background:#000;

}

.frame {

  position:absolute;

  width:64%;

  height:64%;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  border:
    3px solid white;

  border-radius:18px;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,.20);

  pointer-events:none;

}

/* ==========================================
   FALLBACK
   ========================================== */

#fallback {

  display:none;

  margin-top:15px;

  background:#f8f8f8;

  border-radius:16px;

  padding:18px;

}

.fallback-title {

  font-size:18px;

  font-weight:bold;

}

.fallback-text {

  color:#666;

  font-size:13px;

  line-height:1.7;

  margin:
    8px 0 15px;

}

.camera-label {

  display:block;

  width:100%;

  padding:16px;

  background:#111;

  color:white;

  border-radius:13px;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

/* ==========================================
   PREVIEW
   ========================================== */

#preview {

  display:none;

  width:100%;

  max-height:350px;

  object-fit:contain;

  margin-top:15px;

  border-radius:14px;

  background:#eee;

}

/* ==========================================
   STATUS
   ========================================== */

.status {

  margin-top:15px;

  padding:13px;

  background:#f7f7f7;

  border-radius:12px;

  color:#666;

  font-size:13px;

  line-height:1.7;

}

.error {

  display:none;

  margin-top:13px;

  padding:13px;

  border-radius:12px;

  background:#ffebee;

  color:#c62828;

  font-size:13px;

  line-height:1.7;

}

.success-message {

  color:#2e7d32;

  font-weight:bold;

}

/* ==========================================
   RESULT
   ========================================== */

#result {

  display:none;

  margin-top:15px;

  background:#f1f8e9;

  border-radius:18px;

  padding:22px;

}

.member-id {

  font-size:28px;

  font-weight:bold;

  margin:15px 0;

}

.result-offer {

  font-size:16px;

  font-weight:bold;

  line-height:1.7;

}

/* ==========================================
   BUTTONS
   ========================================== */

button {

  width:100%;

  border:none;

  border-radius:13px;

  padding:16px;

  margin-top:12px;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

.confirm {

  background:#111;

  color:white;

}

.back {

  background:#e6e6e6;

  color:#111;

}

.hidden-canvas {

  display:none;

}

</style>

</head>

<body>


<div class="container">


<!-- ==========================================
     HEADER
     ========================================== -->

<div class="header">

  <div class="logo">
    SALT PASS
  </div>

  <div
    id="shopName"
    class="shop">
    جاري تحميل المحل...
  </div>

  <div
    id="offerTitle"
    class="offer-title">
    جاري تحميل العرض...
  </div>

</div>


<!-- ==========================================
     SCANNER
     ========================================== -->

<div
  id="scannerCard"
  class="card">


  <div class="status">

    وجّه الكاميرا نحو QR بطاقة العميل

  </div>


  <!-- LIVE CAMERA -->

  <div
    id="liveCameraArea"
    style="margin-top:12px;">

    <div class="camera-box">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="frame"></div>

    </div>

  </div>


  <!-- FALLBACK -->

  <div
    id="fallback">

    <div class="fallback-title">

      📷 استخدام كاميرا الهاتف

    </div>

    <div class="fallback-text">

      تعذر قراءة QR بالكاميرا المباشرة.
      اضغط الزر التالي لفتح كاميرا الهاتف
      والتقاط صورة للبطاقة.

    </div>


    <label
      for="cameraInput"
      class="camera-label">

      📷 التقاط صورة QR

    </label>


    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      style="display:none;">

  </div>


  <!-- IMAGE PREVIEW -->

  <img
    id="preview"
    alt="صورة QR">


  <!-- STATUS -->

  <div
    id="status"
    class="status">

    جاري تشغيل الكاميرا...

  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="error">
  </div>


  <button
    class="back"
    onclick="goBack()">

    رجوع

  </button>


</div>


<!-- ==========================================
     RESULT
     ========================================== -->

<div id="result">


  <div
    class="success-message">

    ✅ تم قراءة بطاقة العميل

  </div>


  <div
    id="memberId"
    class="member-id">
  </div>


  <div>
    العرض:
  </div>


  <div
    id="resultOffer"
    class="result-offer">
  </div>


  <button
    class="confirm"
    onclick="confirmOffer()">

    ✅ تأكيد تنفيذ العرض

  </button>


  <button
    class="back"
    onclick="restart()">

    🔄 إعادة المسح

  </button>


</div>


<!-- hidden canvases -->

<canvas
  id="canvas"
  class="hidden-canvas">
</canvas>


<canvas
  id="canvas2"
  class="hidden-canvas">
</canvas>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let stream = null;

let scanning = false;

let animationFrame = null;

let scannedMemberId = "";


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// STATUS
// =====================================================

function setStatus(
  text
) {

  document.getElementById(
    "status"
  ).innerText =
    text;

}


// =====================================================
// ERROR
// =====================================================

function showError(
  message
) {

  const element =
    document.getElementById(
      "error"
    );


  element.innerText =
    message;


  element.style.display =
    "block";

}


// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {

  const element =
    document.getElementById(
      "error"
    );


  element.innerText =
    "";


  element.style.display =
    "none";

}


// =====================================================
// PARAMETERS CHECK
// =====================================================

function validParameters() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return false;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return false;

  }


  return true;

}


// =====================================================
// START DIRECT CAMERA
// =====================================================

async function startCamera() {

  hideError();


  if (
    !validParameters()
  ) {

    return;

  }


  /*
    إذا كانت الكاميرا متاحة
    نحاول تشغيلها مباشرة.
  */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showFallback(
      "المتصفح لا يوفر الكاميرا المباشرة."
    );

    return;

  }


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 1280
            }

          },

          audio:false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    await video.play();


    document.getElementById(
      "liveCameraArea"
    ).style.display =
      "block";


    document.getElementById(
      "fallback"
    ).style.display =
      "none";


    setStatus(
      "📷 الكاميرا تعمل — وجّه QR داخل الإطار"
    );


    scanning =
      true;


    scanVideo();


  } catch(error) {

    console.error(
      "DIRECT CAMERA ERROR",
      error
    );


    showFallback(
      "تعذر تشغيل الكاميرا المباشرة."
    );

  }

}


// =====================================================
// FALLBACK
// =====================================================

function showFallback(
  message
) {

  stopCamera();


  document.getElementById(
    "liveCameraArea"
  ).style.display =
    "none";


  document.getElementById(
    "fallback"
  ).style.display =
    "block";


  setStatus(
    message
  );

}


// =====================================================
// LIVE QR SCAN
// =====================================================

function scanVideo() {

  if (!scanning) {
    return;
  }


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:true
        }
      );


    context.drawImage(

      video,

      0,
      0,

      canvas.width,
      canvas.height

    );


    const image =
      context.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );


    if (
      typeof jsQR ===
      "function"
    ) {

      const code =
        jsQR(

          image.data,

          image.width,

          image.height,

          {
            inversionAttempts:
              "attemptBoth"
          }

        );


      if (
        code &&
        code.data
      ) {

        handleQRCode(
          code.data
        );

        return;

      }

    }

  }


  animationFrame =
    requestAnimationFrame(
      scanVideo
    );

}


// =====================================================
// IMAGE INPUT
// =====================================================

document.getElementById(
  "cameraInput"
).addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {
      return;
    }


    hideError();


    setStatus(
      "⏳ جاري معالجة صورة QR..."
    );


    stopCamera();


    const image =
      new Image();


    const objectUrl =
      URL.createObjectURL(
        file
      );


    image.onload =
      async function() {

        try {

          document.getElementById(
            "preview"
          ).src =
            objectUrl;


          document.getElementById(
            "preview"
          ).style.display =
            "block";


          /*
            نجرب أكثر من حجم للصورة.
            هذا مهم إذا كان QR صغيرًا داخل الصورة.
          */

          const result =
            await decodeImageMultipleWays(
              image
            );


          if (
            result
          ) {

            handleQRCode(
              result
            );

            return;

          }


          showError(

            "⚠️ لم يتم العثور على QR في الصورة. " +

            "صوّر البطاقة من قريب، واجعل QR واضحًا وكاملًا داخل الصورة."

          );


          setStatus(
            "لم يتم العثور على QR"
          );


        } catch(error) {

          console.error(
            "IMAGE DECODE ERROR",
            error
          );


          showError(
            "❌ حدث خطأ أثناء قراءة صورة QR."
          );


          setStatus(
            "تعذر قراءة الصورة"
          );

        } finally {

          URL.revokeObjectURL(
            objectUrl
          );

        }

      };


    image.onerror =
      function() {

        URL.revokeObjectURL(
          objectUrl
        );


        showError(
          "❌ تعذر فتح الصورة."
        );

      };


    image.src =
      objectUrl;

  }
);


// =====================================================
// MULTIPLE IMAGE DECODING
// =====================================================

async function decodeImageMultipleWays(
  image
) {

  if (
    typeof jsQR !==
    "function"
  ) {

    showError(
      "❌ لم يتم تحميل قارئ QR. تأكد من اتصال الإنترنت."
    );

    return "";

  }


  /*
    الأحجام التي سنجربها.
  */

  const widths = [

    image.naturalWidth,

    Math.min(
      1500,
      image.naturalWidth * 1.5
    ),

    Math.min(
      2000,
      image.naturalWidth * 2
    )

  ];


  for (
    let i=0;
    i<widths.length;
    i++
  ) {

    const result =
      decodeAtSize(
        image,
        widths[i],
        false
      );


    if (result) {

      return result;

    }


    /*
      نجرب أيضًا صورة grayscale.
    */

    const grayResult =
      decodeAtSize(
        image,
        widths[i],
        true
      );


    if (grayResult) {

      return grayResult;

    }

  }


  return "";

}


// =====================================================
// DECODE AT SIZE
// =====================================================

function decodeAtSize(
  image,
  targetWidth,
  grayscale
) {

  const ratio =
    image.naturalHeight /
    image.naturalWidth;


  const targetHeight =
    Math.round(
      targetWidth *
      ratio
    );


  const canvas =
    document.getElementById(
      "canvas2"
    );


  canvas.width =
    targetWidth;


  canvas.height =
    targetHeight;


  const context =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  context.drawImage(

    image,

    0,
    0,

    targetWidth,
    targetHeight

  );


  let imageData =
    context.getImageData(

      0,
      0,

      targetWidth,
      targetHeight

    );


  /*
    إذا كنا نجرب grayscale
  */

  if (grayscale) {

    const data =
      imageData.data;


    for (
      let i=0;
      i<data.length;
      i+=4
    ) {

      const gray =
        Math.round(

          0.299 * data[i] +

          0.587 * data[i+1] +

          0.114 * data[i+2]

        );


      data[i] =
        gray;


      data[i+1] =
        gray;


      data[i+2] =
        gray;

    }

  }


  const code =
    jsQR(

      imageData.data,

      imageData.width,

      imageData.height,

      {
        inversionAttempts:
          "attemptBoth"
      }

    );


  if (
    code &&
    code.data
  ) {

    return code.data;

  }


  return "";

}


// =====================================================
// HANDLE QR
// =====================================================

function handleQRCode(
  value
) {

  const memberId =
    extractMemberId(
      value
    );


  if (!memberId) {

    showError(
      "⚠️ تم العثور على QR لكنه ليس بطاقة SALT PASS."
    );

    return;

  }


  scannedMemberId =
    memberId;


  stopCamera();


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;


  setStatus(
    "✅ تم التعرف على البطاقة"
  );

}


// =====================================================
// EXTRACT MEMBER ID
// =====================================================

function extractMemberId(
  value
) {

  const text =
    String(
      value || ""
    ).trim();


  /*
    الحالة 1:
    QR = SP-0006
  */

  if (
    /^SP-\d+$/i.test(
      text
    )
  ) {

    return text.toUpperCase();

  }


  /*
    الحالة 2:
    QR يحتوي URL
  */

  try {

    const url =
      new URL(
        text
      );


    const card =
      url.searchParams.get(
        "card"
      );


    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch(e) {}


  /*
    الحالة 3:
    العثور على SP-XXXX داخل النص
  */

  const match =
    text.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// STOP CAMERA
// =====================================================

function stopCamera() {

  scanning =
    false;


  if (
    animationFrame
  ) {

    cancelAnimationFrame(
      animationFrame
    );


    animationFrame =
      null;

  }


  if (
    stream
  ) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (video) {

    video.srcObject =
      null;

  }

}


// =====================================================
// CONFIRM
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  const finalUrl =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    finalUrl;

}


// =====================================================
// RESTART
// =====================================================

function restart() {

  scannedMemberId =
    "";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "fallback"
  ).style.display =
    "block";


  document.getElementById(
    "liveCameraArea"
  ).style.display =
    "none";


  document.getElementById(
    "cameraInput"
  ).value =
    "";


  hideError();


  setStatus(
    "📷 يمكنك التقاط صورة QR من كاميرا الهاتف"
  );

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  stopCamera();

  history.back();

}


// =====================================================
// START
// =====================================================

startCamera();

</script>

</body>

</html>
