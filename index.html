<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1">

<title>SALT PASS Scanner</title>

<!-- ZXing Browser -->
<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {

  padding: 12px;

  background: #f3f5f7;

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  text-align: center;

}

.container {

  width: 100%;

  max-width: 430px;

  margin: auto;

}

.header {

  background: #111;

  color: white;

  padding: 22px 15px;

  border-radius: 22px;

  margin-bottom: 14px;

}

.logo {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: 2px;

}

.shop {

  font-size: 19px;

  margin-top: 8px;

}

.offer {

  color: #bbb;

  font-size: 14px;

  margin-top: 7px;

  line-height: 1.5;

}

.card {

  background: white;

  border-radius: 20px;

  padding: 14px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}

.instruction {

  color: #555;

  font-size: 14px;

  line-height: 1.7;

  margin-bottom: 12px;

}


/* ===============================
   CAMERA
   =============================== */

.camera-wrap {

  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  background: #000;

  border-radius: 16px;

  overflow: hidden;

}

#video {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

  background: #000;

}

.frame {

  position: absolute;

  width: 64%;

  height: 64%;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  border:
    3px solid white;

  border-radius: 18px;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,.20);

  pointer-events: none;

}


/* ===============================
   FALLBACK IMAGE
   =============================== */

#fallback {

  display: none;

  margin-top: 15px;

  background: #f7f7f7;

  padding: 18px;

  border-radius: 16px;

}

.fallback-title {

  font-size: 18px;

  font-weight: bold;

}

.fallback-text {

  margin-top: 8px;

  color: #666;

  font-size: 13px;

  line-height: 1.7;

}

.camera-label {

  display: block;

  margin-top: 14px;

  padding: 16px;

  background: #111;

  color: white;

  border-radius: 13px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

.camera-input {

  display: none;

}


/* ===============================
   STATUS
   =============================== */

.status {

  margin-top: 14px;

  background: #f7f7f7;

  padding: 12px;

  border-radius: 12px;

  color: #666;

  font-size: 13px;

  line-height: 1.7;

}


/* ===============================
   ERROR
   =============================== */

.error {

  display: none;

  margin-top: 12px;

  padding: 12px;

  border-radius: 12px;

  background: #ffebee;

  color: #c62828;

  font-size: 13px;

  line-height: 1.7;

}


/* ===============================
   PREVIEW
   =============================== */

#preview {

  display: none;

  width: 100%;

  max-height: 350px;

  object-fit: contain;

  margin-top: 14px;

  border-radius: 13px;

  background: #eee;

}


/* ===============================
   RESULT
   =============================== */

#result {

  display: none;

  margin-top: 15px;

  background: #f1f8e9;

  padding: 22px;

  border-radius: 18px;

}

.success {

  color: #2e7d32;

  font-size: 20px;

  font-weight: bold;

}

.member-id {

  font-size: 27px;

  font-weight: bold;

  margin: 15px 0;

}

.offer-result {

  font-size: 16px;

  font-weight: bold;

  line-height: 1.7;

}


/* ===============================
   BUTTONS
   =============================== */

button {

  width: 100%;

  border: none;

  border-radius: 13px;

  padding: 16px;

  margin-top: 12px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

.confirm {

  background: #111;

  color: white;

}

.back {

  background: #e7e7e7;

  color: #111;

}

</style>

</head>


<body>


<div class="container">


<!-- ===================================
     HEADER
     =================================== -->

<div class="header">

  <div class="logo">
    SALT PASS
  </div>

  <div
    id="shopName"
    class="shop">
    جاري تحميل المحل...
  </div>

  <div
    id="offerTitle"
    class="offer">
    جاري تحميل العرض...
  </div>

</div>


<!-- ===================================
     SCANNER
     =================================== -->

<div
  id="scannerCard"
  class="card">


  <div class="instruction">

    وجّه كاميرا الهاتف نحو QR بطاقة العميل

  </div>


  <div class="camera-wrap">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="frame"></div>

  </div>


  <div
    id="fallback">


    <div class="fallback-title">

      📷 استخدم كاميرا الهاتف

    </div>


    <div class="fallback-text">

      إذا لم تعمل الكاميرا المباشرة،
      اضغط الزر وافتح كاميرا الهاتف
      لالتقاط صورة واضحة للـQR.

    </div>


    <label
      for="cameraInput"
      class="camera-label">

      📷 التقاط صورة QR

    </label>


    <input
      id="cameraInput"
      class="camera-input"
      type="file"
      accept="image/*"
      capture="environment">

  </div>


  <img
    id="preview"
    alt="QR">


  <div
    id="status"
    class="status">

    ⏳ جاري تشغيل الماسح...

  </div>


  <div
    id="error"
    class="error">
  </div>


  <button
    class="back"
    onclick="goBack()">

    رجوع

  </button>


</div>


<!-- ===================================
     RESULT
     =================================== -->

<div id="result">

  <div class="success">

    ✅ تم قراءة بطاقة العميل

  </div>


  <div
    id="memberId"
    class="member-id">
  </div>


  <div>
    العرض:
  </div>


  <div
    id="resultOffer"
    class="offer-result">
  </div>


  <button
    class="confirm"
    onclick="confirmOffer()">

    ✅ تأكيد تنفيذ العرض

  </button>


  <button
    class="back"
    onclick="restart()">

    🔄 إعادة المسح

  </button>

</div>


</div>


<script>


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let codeReader = null;

let controls = null;

let scannedMemberId = "";


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// STATUS
// =====================================================

function setStatus(
  message
) {

  document.getElementById(
    "status"
  ).innerText =
    message;

}


// =====================================================
// ERROR
// =====================================================

function showError(
  message
) {

  const el =
    document.getElementById(
      "error"
    );


  el.innerText =
    message;


  el.style.display =
    "block";

}


// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {

  const el =
    document.getElementById(
      "error"
    );


  el.innerText =
    "";


  el.style.display =
    "none";

}


// =====================================================
// VALIDATE
// =====================================================

function validateParameters() {

  if (!SHOP_ID) {

    showError(
      "❌ لم يتم تحديد المحل."
    );

    return false;

  }


  if (!OFFER_ID) {

    showError(
      "❌ لم يتم تحديد العرض."
    );

    return false;

  }


  return true;

}


// =====================================================
// GET MEMBER ID
// =====================================================

function extractMemberId(
  text
) {

  const value =
    String(
      text || ""
    ).trim();


  // QR مباشر

  if (
    /^SP-\d+$/i.test(
      value
    )
  ) {

    return value.toUpperCase();

  }


  // QR رابط

  try {

    const url =
      new URL(
        value
      );


    const card =
      url.searchParams.get(
        "card"
      );


    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch(e) {}


  // بحث داخل النص

  const match =
    value.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// START ZXING CAMERA
// =====================================================

async function startCamera() {

  hideError();


  if (
    !validateParameters()
  ) {

    return;

  }


  setStatus(
    "⏳ جاري تشغيل الكاميرا..."
  );


  try {

    if (
      !codeReader
    ) {

      codeReader =
        new ZXingBrowser.BrowserQRCodeReader();

    }


    const video =
      document.getElementById(
        "video"
      );


    /*
      نترك اختيار الكاميرا للمكتبة.
      عند عدم إعطاء deviceId
      تفضل الكاميرا الخلفية إذا كانت متاحة.
    */

    controls =
      await codeReader.decodeFromVideoDevice(

        undefined,

        video,

        function(
          result,
          error
        ) {

          if (
            result &&
            result.text
          ) {

            handleScan(
              result.text
            );

          }

        }

      );


    setStatus(
      "📷 الكاميرا تعمل — وجّه QR داخل الإطار"
    );


  } catch(error) {

    console.error(
      "ZXing camera error:",
      error
    );


    setStatus(
      "الكاميرا المباشرة غير متاحة."
    );


    document.getElementById(
      "fallback"
    ).style.display =
      "block";


    showError(
      "❌ تعذر تشغيل الكاميرا المباشرة. استخدم زر التقاط صورة QR."
    );

  }

}


// =====================================================
// HANDLE SCAN
// =====================================================

function handleScan(
  value
) {

  if (
    scannedMemberId
  ) {

    return;

  }


  const memberId =
    extractMemberId(
      value
    );


  if (!memberId) {

    showError(
      "⚠️ تم العثور على QR لكنه ليس بطاقة SALT PASS."
    );

    return;

  }


  scannedMemberId =
    memberId;


  stopCamera();


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "memberId"
  ).innerText =
    scannedMemberId;


  setStatus(
    "✅ تم التعرف على البطاقة"
  );

}


// =====================================================
// STOP CAMERA
// =====================================================

function stopCamera() {

  try {

    if (
      controls
    ) {

      controls.stop();

    }

  } catch(e) {}


  controls =
    null;

}


// =====================================================
// IMAGE FALLBACK
// =====================================================

document.getElementById(
  "cameraInput"
).addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {
      return;
    }


    hideError();


    setStatus(
      "⏳ جاري قراءة صورة QR..."
    );


    const image =
      document.createElement(
        "img"
      );


    const objectUrl =
      URL.createObjectURL(
        file
      );


    image.src =
      objectUrl;


    image.onload =
      async function() {

        try {

          const preview =
            document.getElementById(
              "preview"
            );


          preview.src =
            objectUrl;


          preview.style.display =
            "block";


          if (
            !codeReader
          ) {

            codeReader =
              new ZXingBrowser.BrowserQRCodeReader();

          }


          let result = null;


          try {

            result =
              await codeReader.decodeFromImageElement(
                image
              );

          } catch(
            decodeError
          ) {

            console.warn(
              "Image decode failed:",
              decodeError
            );

          }


          if (
            result &&
            result.text
          ) {

            handleScan(
              result.text
            );


            URL.revokeObjectURL(
              objectUrl
            );


            return;

          }


          setStatus(
            "لم يتم العثور على QR"
          );


          showError(

            "⚠️ لم يتم العثور على QR. " +
            "التقط الصورة من قريب واجعل QR كاملًا وواضحًا."

          );


        } catch(error) {

          console.error(
            "Image scanner error:",
            error
          );


          setStatus(
            "تعذر قراءة الصورة"
          );


          showError(
            "❌ تعذر قراءة صورة QR."
          );

        }

      };


    image.onerror =
      function() {

        URL.revokeObjectURL(
          objectUrl
        );


        showError(
          "❌ تعذر فتح الصورة."
        );

      };

  }
);


// =====================================================
// CONFIRM
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  if (!SHOP_ID) {

    alert(
      "لم يتم تحديد المحل."
    );

    return;

  }


  if (!OFFER_ID) {

    alert(
      "لم يتم تحديد العرض."
    );

    return;

  }


  const url =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    url;

}


// =====================================================
// RESTART
// =====================================================

function restart() {

  scannedMemberId =
    "";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "cameraInput"
  ).value =
    "";


  document.getElementById(
    "fallback"
  ).style.display =
    "none";


  document.getElementById(
    "liveCameraArea"
  ).style.display =
    "block";


  startCamera();

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  stopCamera();

  history.back();

}


// =====================================================
// START
// =====================================================

startCamera();

</script>

</body>

</html>
