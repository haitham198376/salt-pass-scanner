<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>SALT PASS</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 30px 20px;
    border-radius: 22px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
    margin-bottom: 5px;
}

.shop {
    color: #666;
    margin-bottom: 25px;
}

.discount {
    width: 100%;
    padding: 18px;
    margin: 10px 0;
    border: none;
    border-radius: 13px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.d15 {
    background: #e8f5e9;
}

.d20 {
    background: #e3f2fd;
}

.d30 {
    background: #fff3e0;
}

#scannerSection {
    display: none;
}

#reader {
    width: 100%;
    margin-top: 20px;
}

.selected {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    background: #f1f8e9;
}

.confirm {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 19px;
    font-weight: bold;
    margin-top: 15px;
}

.back {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    margin-top: 10px;
    font-size: 16px;
}

</style>

</head>


<body>

<div class="container">


<div id="home">

<h1>SALT PASS</h1>

<div class="shop">
مطعم السلط
</div>

<h3>
اختر الخصم المقدم للعميل
</h3>


<button
class="discount d15"
onclick="startScanner('15%')">

15% خصم

</button>


<button
class="discount d20"
onclick="startScanner('20%')">

20% خصم

</button>


<button
class="discount d30"
onclick="startScanner('30%')">

30% خصم

</button>

</div>



<div id="scannerSection">

<h1>SALT PASS</h1>

<div class="selected">

الخصم المختار:

<span id="selectedDiscount"></span>

</div>

<p>
وجّه الكاميرا نحو QR بطاقة العميل
</p>

<div id="reader"></div>

<button
class="back"
onclick="location.reload()">

رجوع

</button>

</div>



<div id="result" class="result">

<h2>✅ البطاقة صالحة</h2>

<p>
<strong>رقم العضوية:</strong>
<span id="memberId"></span>
</p>

<p>
<strong>الخصم:</strong>
<span id="memberDiscount"></span>
</p>

<button
class="confirm"
onclick="confirmDiscount()">

✅ تأكيد تنفيذ الخصم

</button>

</div>


</div>


<script>


let scanner = null;

let selectedDiscount = "";

let scannedMember = "";


function startScanner(discount) {

selectedDiscount = discount;


document.getElementById("home")
.style.display = "none";


document.getElementById("scannerSection")
.style.display = "block";


document.getElementById("selectedDiscount")
.innerText = discount;


scanner = new Html5Qrcode("reader");


scanner.start(

{
    facingMode: "environment"
},

{
    fps: 10,

    qrbox: {
        width: 250,
        height: 250
    }
},

function(decodedText) {


scannedMember =
decodedText.trim();


scanner.stop();


document.getElementById("scannerSection")
.style.display = "none";


document.getElementById("result")
.style.display = "block";


document.getElementById("memberId")
.innerText =
scannedMember;


document.getElementById("memberDiscount")
.innerText =
selectedDiscount;


},

function(errorMessage) {

// تجاهل أخطاء البحث العادية

}

).catch(function(error) {

alert(
"تعذر تشغيل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا."
);

});

}



function confirmDiscount() {


alert(

"✅ تم تأكيد الخصم\\n\\n" +

"رقم العضوية: " +
scannedMember +

"\\nالخصم: " +
selectedDiscount

);


}


</script>

</body>

</html>
