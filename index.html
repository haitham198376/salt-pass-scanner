<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>SALT PASS Scanner</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #f3f5f7;
  font-family: Arial, Tahoma, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 430px;
  margin: auto;
}

.header {
  background: #111;
  color: #fff;
  padding: 24px 15px;
  border-radius: 22px;
  margin-bottom: 15px;
}

.logo {
  font-size: 29px;
  font-weight: 800;
  letter-spacing: 2px;
}

.shop {
  margin-top: 8px;
  font-size: 20px;
}

.offer {
  margin-top: 7px;
  color: #bbb;
  font-size: 14px;
  line-height: 1.6;
}

.card {
  background: #fff;
  padding: 22px 16px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.title {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.7;
}

.text {
  margin-top: 8px;
  color: #666;
  font-size: 13px;
  line-height: 1.8;
}

.camera-button {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 18px;
  border-radius: 14px;
  background: #111;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.camera-input {
  display: none;
}

.status {
  margin-top: 15px;
  padding: 13px;
  border-radius: 12px;
  background: #f7f7f7;
  color: #666;
  font-size: 13px;
  line-height: 1.7;
}

.error {
  display: none;
  margin-top: 13px;
  padding: 13px;
  border-radius: 12px;
  background: #ffebee;
  color: #c62828;
  font-size: 13px;
  line-height: 1.7;
}

#preview {
  display: none;
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 14px;
  background: #eee;
}

#result {
  display: none;
  margin-top: 15px;
  background: #f1f8e9;
  padding: 24px 18px;
  border-radius: 18px;
}

.success {
  color: #2e7d32;
  font-size: 21px;
  font-weight: bold;
}

.member-id {
  font-size: 28px;
  font-weight: bold;
  margin: 15px 0;
}

.offer-result {
  font-size: 16px;
  font-weight: bold;
  line-height: 1.7;
}

button {
  width: 100%;
  border: none;
  border-radius: 13px;
  padding: 16px;
  margin-top: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.confirm {
  background: #111;
  color: #fff;
}

.retry {
  background: #e7e7e7;
  color: #111;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      SALT PASS
    </div>

    <div
      id="shopName"
      class="shop">
      جاري تحميل المحل...
    </div>

    <div
      id="offerTitle"
      class="offer">
      جاري تحميل العرض...
    </div>

  </div>


  <div
    id="scannerCard"
    class="card">

    <div class="title">
      📷 مسح بطاقة العميل
    </div>

    <div class="text">
      اضغط الزر لفتح كاميرا الهاتف الأصلية والتقاط صورة واضحة لرمز QR.
    </div>

    <label
      for="cameraInput"
      class="camera-button">

      📷 التقاط صورة QR

    </label>

    <input
      id="cameraInput"
      class="camera-input"
      type="file"
      accept="image/*"
      capture="environment">

    <div
      id="status"
      class="status">

      جاهز لالتقاط صورة QR.

    </div>

    <img
      id="preview"
      alt="QR">

    <div
      id="error"
      class="error">
    </div>

    <button
      class="retry"
      onclick="goBack()">

      رجوع

    </button>

  </div>


  <div id="result">

    <div class="success">
      ✅ تم قراءة بطاقة العميل
    </div>

    <div
      id="memberId"
      class="member-id">
    </div>

    <div>
      العرض:
    </div>

    <div
      id="resultOffer"
      class="offer-result">
    </div>

    <button
      class="confirm"
      onclick="confirmOffer()">

      ✅ تأكيد تنفيذ العرض

    </button>

    <button
      class="retry"
      onclick="retry()">

      🔄 مسح بطاقة أخرى

    </button>

  </div>

</div>


<script type="module">

/*
  qr-scanner:
  يدعم المسح من ملف/Blob مباشرة.
*/

import QrScanner
  from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


// =====================================================
// PARAMETERS
// =====================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const SHOP_ID =
  params.get("shopId") || "";


const SHOP_NAME =
  params.get("shop") || "";


const OFFER_ID =
  params.get("offerId") || "";


const OFFER_TITLE =
  params.get("offerTitle") || "";


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwmLk-7BH1pZozto0tKbk1LqmM6g6jUcoMAR1XzslGxVwmwJAhNkrCjW5ARBNky8wdl/exec";


let scannedMemberId = "";


// =====================================================
// DISPLAY
// =====================================================

document.getElementById(
  "shopName"
).innerText =
  SHOP_NAME || "SALT PASS";


document.getElementById(
  "offerTitle"
).innerText =
  OFFER_TITLE || "العرض";


document.getElementById(
  "resultOffer"
).innerText =
  OFFER_TITLE || "العرض";


// =====================================================
// STATUS
// =====================================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerText =
    message;

}


// =====================================================
// ERROR
// =====================================================

function showError(message) {

  const el =
    document.getElementById(
      "error"
    );

  el.innerText =
    message;

  el.style.display =
    "block";

}


// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {

  const el =
    document.getElementById(
      "error"
    );

  el.innerText =
    "";

  el.style.display =
    "none";

}


// =====================================================
// EXTRACT MEMBER ID
// =====================================================

function extractMemberId(text) {

  const value =
    String(text || "").trim();


  // SP-0006

  if (
    /^SP-\d+$/i.test(
      value
    )
  ) {

    return value.toUpperCase();

  }


  // URL

  try {

    const url =
      new URL(value);

    const card =
      url.searchParams.get(
        "card"
      );

    if (
      card &&
      /^SP-\d+$/i.test(
        card
      )
    ) {

      return card.toUpperCase();

    }

  } catch (e) {}


  // text contains SP-XXXX

  const match =
    value.match(
      /SP-\d+/i
    );


  if (match) {

    return match[0].toUpperCase();

  }


  return "";

}


// =====================================================
// FILE INPUT
// =====================================================

document.getElementById(
  "cameraInput"
).addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {
      return;
    }


    hideError();


    setStatus(
      "⏳ جاري قراءة صورة QR..."
    );


    const preview =
      document.getElementById(
        "preview"
      );


    const previewUrl =
      URL.createObjectURL(
        file
      );


    preview.src =
      previewUrl;


    preview.style.display =
      "block";


    try {

      /*
        qr-scanner يدعم File/Blob
        مباشرة.
      */

      const result =
        await QrScanner.scanImage(
          file,
          {
            returnDetailedScanResult:
              true,

            alsoTryWithoutScanRegion:
              true,

            maxScansPerSecond:
              10
          }
        );


      const decodedText =
        result &&
        result.data
          ? result.data
          : "";


      const memberId =
        extractMemberId(
          decodedText
        );


      if (!memberId) {

        setStatus(
          "تم العثور على QR غير تابع لـ SALT PASS."
        );


        showError(
          "⚠️ تم قراءة QR، لكن الرمز ليس بطاقة SALT PASS."
        );


        return;

      }


      scannedMemberId =
        memberId;


      /*
        نجاح
      */

      document.getElementById(
        "scannerCard"
      ).style.display =
        "none";


      document.getElementById(
        "result"
      ).style.display =
        "block";


      document.getElementById(
        "memberId"
      ).innerText =
        scannedMemberId;


      setStatus(
        "✅ تم التعرف على البطاقة."
      );


    } catch (error) {

      console.error(
        "QR IMAGE ERROR:",
        error
      );


      setStatus(
        "لم يتم العثور على QR."
      );


      showError(

        "⚠️ لم نتمكن من قراءة QR من الصورة. " +
        "أعد التصوير من مسافة أقرب، واجعل الرمز كاملًا وواضحًا."

      );

    }

  }
);


// =====================================================
// CONFIRM
// =====================================================

function confirmOffer() {

  if (!scannedMemberId) {

    alert(
      "لم تتم قراءة بطاقة العميل."
    );

    return;

  }


  if (!SHOP_ID) {

    alert(
      "المحل غير محدد."
    );

    return;

  }


  if (!OFFER_ID) {

    alert(
      "العرض غير محدد."
    );

    return;

  }


  const url =

    APPS_SCRIPT_URL +

    "?memberId=" +
    encodeURIComponent(
      scannedMemberId
    ) +

    "&offerId=" +
    encodeURIComponent(
      OFFER_ID
    ) +

    "&shopId=" +
    encodeURIComponent(
      SHOP_ID
    ) +

    "&shop=" +
    encodeURIComponent(
      SHOP_NAME
    );


  window.location.href =
    url;

}


// =====================================================
// RETRY
// =====================================================

function retry() {

  scannedMemberId =
    "";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "cameraInput"
  ).value =
    "";


  hideError();


  setStatus(
    "جاهز لالتقاط صورة QR."
  );

}


// =====================================================
// BACK
// =====================================================

function goBack() {

  history.back();

}

</script>

</body>

</html>
